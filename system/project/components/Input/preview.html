<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Input — preview</title></head>
<body>
<div class="tray-demo tray-demo--grid">
<div class="tray-field"><label class="tray-label" for="i1">Email</label><input class="tray-input" id="i1" type="email" placeholder="name@example.com"></div>
<div class="tray-field"><label class="tray-label" for="i2">City</label><input class="tray-input" id="i2" value="Lviv"></div>
<div class="tray-field"><label class="tray-label" for="i3">Postcode</label><input class="tray-input" id="i3" aria-invalid="true" value="79" aria-describedby="i3e"><p class="tray-field__error" id="i3e">A postcode has five digits.</p></div>
<div class="tray-field" data-disabled><label class="tray-label" for="i4">Country</label><input class="tray-input" id="i4" value="Ukraine" disabled></div>
<div class="tray-field"><label class="tray-label" for="i5">Order number</label><input class="tray-input" id="i5" value="PL-20418" readonly></div>
<div class="tray-field"><label class="tray-label" for="i6">Small, for toolbars</label><input class="tray-input tray-input--sm" id="i6" placeholder="Filter by name"></div>
<div class="tray-field"><label class="tray-label" for="i7">Label for the jar</label><input class="tray-input" id="i7" type="file"></div>
</div>
</body>
</html>
