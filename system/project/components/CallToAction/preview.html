<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CallToAction — preview</title></head>
<body>
<div class="tray-demo tray-demo--col">
<section class="tray-card tray-card--accent tray-cta">
<div class="tray-cta__text"><h2 class="headline">Pack tomorrow's orders with Counter</h2><p>Free for 14 days. Your products and customers stay yours.</p></div>
<div class="tray-cta__actions"><a class="tray-btn tray-btn--dark" href="#">Start free</a><a class="tray-btn tray-btn--quiet" href="#">Talk to us</a></div>
</section>
<section class="tray-card tray-cta">
<div class="tray-cta__text"><h2 class="title">One letter a month about running a small food business</h2></div>
<form class="tray-input-group" style="flex: 1 1 20rem; max-inline-size: 26rem" onsubmit="return false"><input class="tray-input" type="email" placeholder="you@farm.example" aria-label="Email" autocomplete="email"><button class="tray-input-group__btn tray-input-group__btn--accent" type="submit">Subscribe</button></form>
</section>
</div>
</body>
