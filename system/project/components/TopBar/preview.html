<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TopBar — preview</title></head>
<body>
<div class="tray-demo tray-demo--col">
<header class="tray-topbar">
<div class="tray-topbar__start"><nav aria-label="Breadcrumb"><ol class="tray-crumbs tray-crumbs--fold"><li><a href="#">Perly Farm</a></li><li><a href="#">Orders</a></li><li><span aria-current="page">PL-20431</span></li></ol></nav></div>
<div class="tray-topbar__end"><button class="tray-topbar__search tray-topbar__search--fold" type="button" aria-label="Search orders"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-search"/></svg><span>Search orders</span><kbd class="tray-kbd">/</kbd></button>
<button class="tray-btn tray-btn--quiet tray-btn--sm tray-btn--icon" type="button" aria-label="Help"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-circle-help"/></svg></button>
<span class="tray-anchor"><button class="tray-btn tray-btn--quiet tray-btn--sm tray-btn--icon" type="button" aria-label="Notifications, 2 unread"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-bell"/></svg></button><span class="tray-pip" aria-hidden="true">2</span></span>
<button class="tray-avatar" type="button" aria-label="Account: Oksana Franko, OF">OF</button></div>
</header>
<p class="tray-demo-note">On a card, with a title in place of the breadcrumb</p>
<div class="tray-card" style="padding: var(--space-4) var(--space-5)">
<header class="tray-topbar">
<div class="tray-topbar__start"><a class="tray-back" href="#"><svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-arrow-left"/></svg><span class="tray-vh">Back to orders</span></a><h2 class="nav" style="font-weight: 600">Order PL-20431</h2><span class="tray-badge">To pack</span></div>
<div class="tray-topbar__end"><button class="tray-btn tray-btn--quiet tray-btn--sm" type="button"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-share"/></svg>Share</button><button class="tray-btn tray-btn--quiet tray-btn--sm tray-btn--icon" type="button" aria-label="More actions"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-ellipsis"/></svg></button></div>
</header>
</div>
</div>
</body>
</html>
