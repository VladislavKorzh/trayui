<!-- @dsCard group="Forms" height=417 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FileUpload — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<div class="tray-field tray-demo-fill" style="min-inline-size: min(24rem, 100%)"><span class="tray-label" id="fu-l">Product photos</span>
<div class="tray-drop" data-tray="dropzone" data-list="#fu-list" data-max-mb="10"><span class="tray-drop__icon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-upload"/></svg></span><p class="tray-drop__text"><b>Drop photos here or <u>choose files</u></b><small id="fu-h">PNG or JPG, up to 10 MB each</small></p><input type="file" multiple accept="image/png, image/jpeg" aria-labelledby="fu-l" aria-describedby="fu-h"></div>
<div class="tray-attachments" id="fu-list" style="margin-block-start: var(--space-3)">
<div class="tray-attachment"><span class="tray-attachment__media"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-image"/></svg></span><span class="tray-attachment__body"><span class="tray-attachment__name">jar-50g-front.jpg</span><span class="tray-attachment__meta">1.4 MB</span></span><button class="tray-btn tray-btn--ghost tray-btn--xs tray-btn--icon" type="button" aria-label="Remove jar-50g-front.jpg"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-x"/></svg></button></div>
<div class="tray-attachment"><span class="tray-attachment__media"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-image"/></svg></span><span class="tray-attachment__body"><span class="tray-attachment__name">jar-50g-open.jpg</span><span class="tray-attachment__meta">Uploading, 64%</span><span class="tray-progress__bar" role="progressbar" aria-label="Uploading jar-50g-open.jpg" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64" style="--tray-v: 64"></span></span><button class="tray-btn tray-btn--ghost tray-btn--xs tray-btn--icon" type="button" aria-label="Cancel the upload of jar-50g-open.jpg"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-x"/></svg></button></div>
</div></div>
<div class="tray-stack tray-demo-fill" style="min-inline-size: 18rem">
<p class="tray-demo-note">While files are held over it</p>
<div class="tray-drop" data-over><span class="tray-drop__icon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-upload"/></svg></span><p class="tray-drop__text"><b>Let go to add 3 photos</b></p></div>
<div class="tray-card" style="padding: var(--space-5); border-radius: var(--radius-panel)"><div class="tray-field"><span class="tray-label" id="fu-l2">Price list</span>
<div class="tray-drop tray-drop--row" data-tray="dropzone"><span class="tray-drop__icon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-file"/></svg></span><p class="tray-drop__text"><b><u>Choose a file</u> or drop it</b><small id="fu-h2">CSV, one product per line</small></p><input type="file" accept=".csv" aria-labelledby="fu-l2" aria-describedby="fu-h2"></div></div></div>
</div>
</div>
</body>
</html>
