<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Textarea — preview</title></head>
<body>
<div class="tray-demo tray-demo--grid">
<div class="tray-field"><label class="tray-label" for="t1">Note for the courier <span class="tray-label__opt">(optional)</span></label><textarea class="tray-textarea" id="t1" rows="3" maxlength="140" data-tray="count">Call from the gate, the bell is broken.</textarea><div class="tray-field__foot"><p class="tray-field__hint">Door codes, landmarks, a safe place.</p><span class="tray-field__count"></span></div></div>
<div class="tray-field"><label class="tray-label" for="t2">What went wrong</label><textarea class="tray-textarea" id="t2" rows="3" aria-invalid="true" aria-describedby="t2e"></textarea><p class="tray-field__error" id="t2e">Tell us what happened, in a sentence or two.</p></div>
</div>
</body>
</html>
