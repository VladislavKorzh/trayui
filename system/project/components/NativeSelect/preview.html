<head><meta charset="utf-8"><title>NativeSelect — preview</title></head>
<body>
<div class="tray-demo tray-demo--grid">
<div class="tray-field"><label class="tray-label" for="n1">Delivery window</label><span class="tray-select"><select id="n1"><option>10:00 to 14:00</option><option selected>14:00 to 18:00</option><option>18:00 to 22:00</option></select></span></div>

<div class="tray-field"><label class="tray-label" for="n3">Rows per page</label><span class="tray-select tray-select--sm"><select id="n3"><option>10</option><option>25</option><option>50</option></select></span></div>
</div>
