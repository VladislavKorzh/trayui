<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BillingSummary — preview</title></head>
<body>
<div class="tray-demo tray-demo--col">
<div class="tray-billing">
<section class="tray-card tray-card--inverse" style="padding: var(--space-8)">
<div class="tray-card__head"><div><p class="tray-soft" style="font-size: 1rem">Current plan</p><h2 class="title">Shop</h2></div><span class="tray-badge tray-badge--accent">Active</span></div>
<p class="tray-plan__price">$29<small>a month</small></p>
<p class="tray-soft" style="margin-block-start: var(--space-3); font-size: 1rem">Renews on 1 December 2026.</p>
<div class="tray-card__foot"><a class="tray-btn tray-btn--md" href="#">Change plan</a><button class="tray-btn tray-btn--ghost tray-btn--md" type="button">Cancel plan</button></div>
</section>
<section class="tray-card" style="padding: var(--space-8)">
<h2 class="subtitle" style="margin-block-end: var(--space-4)">Next invoice</h2>
<dl class="tray-dl tray-dl--plain">
<div><dt>Date</dt><dd>1 December 2026</dd></div>
<div><dt>Shop plan</dt><dd class="tray-num">$29.00</dd></div>
<div><dt>Two extra seats</dt><dd class="tray-num">$10.00</dd></div>
<div><dt>Total</dt><dd class="tray-num" style="font-weight: 700">$39.00</dd></div>
<div><dt>Paid with</dt><dd>Card ending 4242</dd></div>
</dl>
<div class="tray-card__foot"><a class="tray-btn tray-btn--quiet tray-btn--sm" href="#">Change the card</a><a class="tray-btn tray-btn--ghost tray-btn--sm" href="#">All invoices</a></div>
</section>
</div>
</div>
</body>
</html>
