<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pagination — preview</title></head>
<body>
<div class="tray-demo tray-demo--col">
<nav aria-label="Pages"><ul class="tray-pages">
<li><a class="tray-page tray-page--step" href="#"><svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-chevron-left"/></svg>Previous</a></li>
<li><a class="tray-page" href="#">1</a></li>
<li><a class="tray-page" href="#" aria-current="page">2</a></li>
<li><a class="tray-page" href="#">3</a></li>
<li><span class="tray-page tray-page--gap" aria-hidden="true">…</span></li>
<li><a class="tray-page" href="#">12</a></li>
<li><a class="tray-page tray-page--step" href="#">Next<svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-chevron-right"/></svg></a></li>
</ul></nav>
<nav aria-label="Pages, compact"><ul class="tray-pages">
<li><a class="tray-page tray-page--step" role="link" aria-disabled="true" aria-label="Previous page"><svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-chevron-left"/></svg></a></li>
<li><span class="tray-pages__status">Page 1 of 12</span></li>
<li><a class="tray-page tray-page--step" href="#" aria-label="Next page"><svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-chevron-right"/></svg></a></li>
</ul></nav>
</div>
</body>
</html>
