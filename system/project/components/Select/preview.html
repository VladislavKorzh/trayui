<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<div class="tray-field tray-demo-fill">
<span class="tray-label" id="s1">Jar size</span>
<div class="tray-anchor tray-anchor--block" data-tray="select">
<button class="tray-select-trigger" type="button" data-placeholder aria-labelledby="s1"><span class="tray-select-trigger__value">Choose a jar</span><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-chevrons-up-down"/></svg></button>
<div class="tray-pop"><div class="tray-list"><button type="button" class="tray-option" role="option" data-value="30"><span class="tray-option__text">30 g</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="50"><span class="tray-option__text">50 g</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="100"><span class="tray-option__text">100 g</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button></div></div>
<input type="hidden" name="jar">
</div>
</div>
<div class="tray-field tray-demo-fill">
<span class="tray-label" id="s2">Delivery</span>
<div class="tray-anchor tray-anchor--block" data-tray="select">
<button class="tray-select-trigger" type="button" aria-labelledby="s2"><span class="tray-select-trigger__value">Courier, chilled box</span><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-chevrons-up-down"/></svg></button>
<div class="tray-pop" data-open><div class="tray-list">
<div role="group" aria-labelledby="s2a"><div class="tray-list__label" id="s2a">To your door</div>
<button type="button" class="tray-option" role="option" data-value="courier" aria-selected="true"><span class="tray-option__text">Courier, chilled box</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="express"><span class="tray-option__text">Express, two hours</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
</div>
<hr class="tray-list__rule" aria-hidden="true">
<div role="group" aria-labelledby="s2b"><div class="tray-list__label" id="s2b">Collect it yourself</div>
<button type="button" class="tray-option" role="option" data-value="shop"><span class="tray-option__text">Farm shop</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="locker" aria-disabled="true"><span class="tray-option__text">Parcel locker</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
</div>
</div></div>
</div>
</div>
</div>
</body>
</html>
