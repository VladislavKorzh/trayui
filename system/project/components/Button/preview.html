<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="tray-demo">
<button class="tray-btn" type="button">Order a jar</button>
<button class="tray-btn tray-btn--dark" type="button">See the farm</button>
<button class="tray-btn tray-btn--quiet" type="button">Details</button>
<button class="tray-btn tray-btn--ghost" type="button">Cancel</button>
<button class="tray-btn tray-btn--danger" type="button">Delete order</button>
<p class="tray-demo-note">Sizes: 64, 56, 48 and 40px</p>
<button class="tray-btn tray-btn--quiet" type="button">Large</button>
<button class="tray-btn tray-btn--quiet tray-btn--md" type="button">Medium</button>
<button class="tray-btn tray-btn--quiet tray-btn--sm" type="button">Small</button>
<button class="tray-btn tray-btn--quiet tray-btn--xs" type="button">Extra small</button>
<button class="tray-btn tray-btn--link" type="button">Read the terms</button>
<p class="tray-demo-note">With an icon, icon only, with a value, disabled, busy</p>
<button class="tray-btn tray-btn--md" type="button"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-shopping-bag"/></svg>Add to order</button>
<button class="tray-btn tray-btn--quiet tray-btn--md" type="button">Next<svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-arrow-right"/></svg></button>
<button class="tray-btn tray-btn--quiet tray-btn--md tray-btn--icon" type="button" aria-label="Search"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-search"/></svg></button>
<button class="tray-btn tray-btn--md tray-btn--split" type="button" style="min-inline-size: 15rem"><span>Order a jar</span><span>$59</span></button>
<button class="tray-btn tray-btn--md" type="button" disabled>Order a jar</button>
<button class="tray-btn tray-btn--dark tray-btn--md" type="button" aria-busy="true"><span class="tray-spinner" aria-hidden="true"></span>Sending</button>
</div>
</body>
</html>
