<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Switch — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<div class="tray-stack tray-stack--sm">
<label class="tray-switch"><input type="checkbox" role="switch"><span class="tray-switch__track"></span><span>Email me the receipt</span></label>
<label class="tray-switch"><input type="checkbox" role="switch" checked><span class="tray-switch__track"></span><span>Order updates by text</span></label>
<label class="tray-switch"><input type="checkbox" role="switch" disabled><span class="tray-switch__track"></span><span>Courier tracking, not in your area yet</span></label>
</div>
<div class="tray-stack tray-stack--sm tray-demo-fill" style="min-inline-size: 22rem">
<label class="tray-switch tray-switch--row"><span class="tray-switch__text"><b>Gift box</b><small>A card box with a note, $12</small></span><input type="checkbox" role="switch" checked><span class="tray-switch__track"></span></label>
<label class="tray-switch tray-switch--row"><span class="tray-switch__text"><b>Leave at the door</b><small>The courier sends a photo</small></span><input type="checkbox" role="switch"><span class="tray-switch__track"></span></label>
</div>
</div>
</body>
</html>
