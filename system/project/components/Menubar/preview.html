<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Menubar — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<div class="tray-menubar" data-tray="menubar" aria-label="Orders">
<div class="tray-anchor" data-tray="menu"><button class="tray-tab" type="button">File</button><div class="tray-pop"><div class="tray-list"><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">New order</span><span class="tray-option__meta">Ctrl N</span></button><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">Duplicate</span><span class="tray-option__meta">Ctrl D</span></button><hr class="tray-list__rule"><div class="tray-submenu"><button type="button" class="tray-option" role="menuitem" aria-haspopup="menu"><span class="tray-option__text">Export</span><svg class="tray-icon tray-icon--flip tray-icon--sm" aria-hidden="true"><use href="#tray-i-chevron-right"/></svg></button><div class="tray-pop tray-pop--side"><div class="tray-list"><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">As a spreadsheet</span></button><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">As a PDF</span></button></div></div></div><hr class="tray-list__rule"><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">Print</span><span class="tray-option__meta">Ctrl P</span></button></div></div></div>
<div class="tray-anchor" data-tray="menu"><button class="tray-tab" type="button">Edit</button><div class="tray-pop"><div class="tray-list"><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">Undo</span><span class="tray-option__meta">Ctrl Z</span></button><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">Redo</span><span class="tray-option__meta">Ctrl Y</span></button><hr class="tray-list__rule"><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">Find</span><span class="tray-option__meta">Ctrl F</span></button><button type="button" class="tray-option tray-option--danger" role="menuitem"><span class="tray-option__text">Delete order</span></button></div></div></div>
<div class="tray-anchor" data-tray="menu"><button class="tray-tab" type="button">View</button><div class="tray-pop" data-open><div class="tray-list"><button type="button" class="tray-option" role="menuitemcheckbox" aria-checked="true"><span class="tray-option__text">Show the totals</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="menuitemcheckbox" aria-checked="false"><span class="tray-option__text">Show cancelled orders</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><hr class="tray-list__rule"><div class="tray-list__label">Density</div><button type="button" class="tray-option" role="menuitemradio" aria-checked="true" data-group="density"><span class="tray-option__text">Comfortable</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="menuitemradio" aria-checked="false" data-group="density"><span class="tray-option__text">Compact</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button></div></div></div>
</div>
</div>
</body>
</html>
