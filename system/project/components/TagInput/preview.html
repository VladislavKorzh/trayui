<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TagInput — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<div class="tray-field tray-demo-fill" style="min-inline-size: 22rem"><label class="tray-label" for="ti-1">Order tags</label>
<div class="tray-tags" data-tray="taginput"><span class="tray-chip" data-value="gift">gift<button type="button" class="tray-chip__x" aria-label="Remove gift"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-x"/></svg></button></span><span class="tray-chip" data-value="chilled">chilled<button type="button" class="tray-chip__x" aria-label="Remove chilled"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-x"/></svg></button></span><input id="ti-1" placeholder="Add a tag" aria-describedby="ti-1h"><input type="hidden" name="tags"></div>
<p class="tray-field__hint" id="ti-1h">Press Enter or a comma after each one.</p></div>
<div class="tray-field tray-demo-fill" style="min-inline-size: 22rem"><label class="tray-label" for="ti-2">Send the report to</label>
<div class="tray-tags" data-tray="taginput" data-pattern="email" aria-invalid="true"><span class="tray-chip" data-value="oksana@perly.example">oksana@perly.example<button type="button" class="tray-chip__x" aria-label="Remove oksana@perly.example"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-x"/></svg></button></span><span class="tray-chip" data-value="books@perly" data-invalid>books@perly<button type="button" class="tray-chip__x" aria-label="Remove books@perly"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-x"/></svg></button></span><input id="ti-2" type="email" placeholder="Add an email" aria-describedby="ti-2e"><input type="hidden" name="to"></div>
<p class="tray-field__error" id="ti-2e">&ldquo;books@perly&rdquo; is not a full email address.</p></div>
<div class="tray-card" style="flex: 1 1 100%; padding: var(--space-6)"><div class="tray-field"><label class="tray-label" for="ti-3">Cities you deliver to</label>
<div class="tray-tags" data-tray="taginput" data-max="4"><span class="tray-chip" data-value="Kyiv">Kyiv<button type="button" class="tray-chip__x" aria-label="Remove Kyiv"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-x"/></svg></button></span><span class="tray-chip" data-value="Lviv">Lviv<button type="button" class="tray-chip__x" aria-label="Remove Lviv"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-x"/></svg></button></span><input id="ti-3" placeholder="Add a city" aria-describedby="ti-3h"><input type="hidden" name="cities"></div>
<p class="tray-field__hint" id="ti-3h">Up to four on the Stall plan.</p></div></div>
</div>
</body>
</html>
