<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ButtonGroup — preview</title></head>
<body>
<div class="tray-demo">
<div class="tray-btn-group" role="group" aria-label="Message actions">
<button class="tray-btn-group__item" type="button"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-arrow-left"/></svg>Reply</button>
<button class="tray-btn-group__item" type="button">Forward</button>
<button class="tray-btn-group__item" type="button">Archive</button>
</div>
<div class="tray-btn-group" role="group" aria-label="Quantity" data-tray="stepper" data-min="1" data-max="9">
<button class="tray-btn-group__item tray-btn-group__item--icon" type="button" data-step="-1" aria-label="One fewer"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-minus"/></svg></button>
<output class="tray-btn-group__value">2</output>
<button class="tray-btn-group__item tray-btn-group__item--icon" type="button" data-step="1" aria-label="One more"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-plus"/></svg></button>
</div>
<div class="tray-btn-group tray-btn-group--sm" role="group" aria-label="File actions">
<button class="tray-btn-group__item tray-btn-group__item--icon" type="button" aria-label="Copy"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-copy"/></svg></button>
<button class="tray-btn-group__item tray-btn-group__item--icon" type="button" aria-label="Download"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-download"/></svg></button>
<button class="tray-btn-group__item tray-btn-group__item--icon" type="button" aria-label="Share"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-share"/></svg></button>
<span class="tray-btn-group__rule"></span>
<button class="tray-btn-group__item tray-btn-group__item--icon" type="button" aria-label="Delete"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-trash-2"/></svg></button>
</div>
<div class="tray-btn-group tray-btn-group--sm" role="group" aria-label="Save">
<button class="tray-btn-group__item" type="button">Save draft</button>
<button class="tray-btn-group__item tray-btn-group__item--icon" type="button" aria-label="More ways to save"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-chevron-down"/></svg></button>
</div>
<div class="tray-btn-group tray-btn-group--sm tray-btn-group--vertical" role="group" aria-label="Zoom">
<button class="tray-btn-group__item tray-btn-group__item--icon" type="button" aria-label="Zoom in"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-plus"/></svg></button>
<button class="tray-btn-group__item tray-btn-group__item--icon" type="button" aria-label="Zoom out"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-minus"/></svg></button>
</div>
</div>
</body>
</html>
