<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Combobox — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<div class="tray-field tray-demo-fill">
<label class="tray-label" for="c1">City</label>
<div class="tray-anchor tray-anchor--block" data-tray="combobox">
<div class="tray-input-group"><span class="tray-input-group__addon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-search"/></svg></span><input class="tray-input" id="c1" placeholder="Find a city"></div>
<div class="tray-pop"><div class="tray-list"><button type="button" class="tray-option" role="option" data-value="dnipro"><span class="tray-option__text">Dnipro</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="kharkiv"><span class="tray-option__text">Kharkiv</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="kyiv"><span class="tray-option__text">Kyiv</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="lviv"><span class="tray-option__text">Lviv</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="odesa"><span class="tray-option__text">Odesa</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="ternopil"><span class="tray-option__text">Ternopil</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><button type="button" class="tray-option" role="option" data-value="uzhhorod"><span class="tray-option__text">Uzhhorod</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><div class="tray-list__empty">No city by that name. Check the spelling.</div></div></div>
</div>
</div>
<div class="tray-field tray-demo-fill">
<label class="tray-label" for="c2">Assign to</label>
<div class="tray-anchor tray-anchor--block" data-tray="combobox">
<div class="tray-input-group"><span class="tray-input-group__addon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-user"/></svg></span><input class="tray-input" id="c2" value="an"></div>
<div class="tray-pop" data-open><div class="tray-list">
<button type="button" class="tray-option tray-option--two" role="option" data-value="anna" data-label="Anna Melnyk"><span class="tray-option__text"><b>Anna Melnyk</b><small>Packing</small></span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<button type="button" class="tray-option tray-option--two" role="option" data-value="bohdan" data-label="Bohdan Shevchuk"><span class="tray-option__text"><b>Bohdan Shevchuk</b><small>Courier</small></span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<button type="button" class="tray-option tray-option--two" role="option" data-value="oksana" data-label="Oksana Franko"><span class="tray-option__text"><b>Oksana Franko</b><small>Farm manager</small></span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<div class="tray-list__empty">Nobody by that name.</div>
</div></div>
</div>
</div>
</div>
</body>
</html>
