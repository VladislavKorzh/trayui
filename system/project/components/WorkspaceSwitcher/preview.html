<!-- @dsCard group="App shell" height=371 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>WorkspaceSwitcher — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<div class="tray-card" style="inline-size: 19rem; padding: var(--space-4); border-radius: var(--radius-panel)"><div class="tray-anchor tray-anchor--block" data-tray="menu">
<button class="tray-switcher" type="button"><span class="tray-avatar tray-avatar--sm tray-avatar--ink" aria-hidden="true">PF</span><span class="tray-person__text"><b>Perly Farm</b><small>Shop plan</small></span><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-chevrons-up-down"/></svg></button>
<div class="tray-pop" data-open><div class="tray-list">
<p class="tray-list__label">Workspaces</p>
<button type="button" class="tray-option" role="menuitemradio" data-group="ws" aria-checked="true"><span class="tray-avatar tray-avatar--xs tray-avatar--ink" aria-hidden="true">PF</span><span class="tray-option__text">Perly Farm</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<button type="button" class="tray-option" role="menuitemradio" data-group="ws" aria-checked="false"><span class="tray-avatar tray-avatar--xs" aria-hidden="true">MB</span><span class="tray-option__text">Meadow Bakery</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<button type="button" class="tray-option" role="menuitemradio" data-group="ws" aria-checked="false"><span class="tray-avatar tray-avatar--xs" aria-hidden="true">HC</span><span class="tray-option__text">Hill Cheese</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<hr class="tray-list__rule">
<button type="button" class="tray-option" role="menuitem"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-plus"/></svg><span class="tray-option__text">New workspace</span></button>
</div></div>
</div></div>
<div class="tray-stack" style="inline-size: 19rem">
<p class="tray-demo-note">On the page, and for a person with a role</p>
<button class="tray-switcher" type="button"><span class="tray-avatar tray-avatar--sm tray-avatar--ink" aria-hidden="true">MB</span><span class="tray-person__text"><b>Meadow Bakery</b><small>You are a packer here</small></span><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-chevrons-up-down"/></svg></button>
</div>
</div>
</body>
</html>
