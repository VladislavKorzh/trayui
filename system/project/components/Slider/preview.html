<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slider — preview</title></head>
<body>
<div class="tray-demo tray-demo--grid">
<div class="tray-slider-field"><div class="tray-slider-field__head"><label class="tray-label tray-label--inline" for="r1">Jars per month</label><output for="r1"></output></div><input class="tray-slider" id="r1" type="range" min="1" max="12" value="4" data-tray="slider"><div class="tray-slider-field__scale"><span>1</span><span>12</span></div></div>
<div class="tray-slider-field"><div class="tray-slider-field__head"><label class="tray-label tray-label--inline" for="r2">Delivery radius</label><output for="r2"></output></div><input class="tray-slider" id="r2" type="range" min="0" max="50" step="10" value="30" data-unit=" km" data-tray="slider"><div class="tray-slider-field__scale"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span></div></div>
<div class="tray-card" style="padding: var(--space-6)"><div class="tray-slider-field"><div class="tray-slider-field__head"><label class="tray-label tray-label--inline" for="r3">Salt, on a tray</label><output for="r3"></output></div><input class="tray-slider" id="r3" type="range" min="0" max="100" value="65" data-unit="%" data-tray="slider"></div></div>
<div class="tray-slider-field"><div class="tray-slider-field__head"><label class="tray-label tray-label--inline" for="r4">Locked</label><output for="r4"></output></div><input class="tray-slider" id="r4" type="range" value="20" disabled data-tray="slider"></div>
</div>
</body>
</html>
