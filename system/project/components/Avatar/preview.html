<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Avatar — preview</title></head>
<body>
<div class="tray-demo">
<span class="tray-avatar tray-avatar--xs">DK</span>
<span class="tray-avatar tray-avatar--sm">AM</span>
<span class="tray-avatar">BS</span>
<span class="tray-avatar tray-avatar--lg">OF</span>
<span class="tray-avatar tray-avatar--ink">DK</span>
<span class="tray-avatar tray-avatar--accent" role="img" aria-label="Assistant"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-sparkle"/></svg></span>
<span class="tray-avatar" role="img" aria-label="No photo"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-user"/></svg></span>
<span class="tray-avatar-group" role="group" aria-label="Packing team, 6 people"><span class="tray-avatar">AM</span><span class="tray-avatar">BS</span><span class="tray-avatar">OF</span><span class="tray-avatar tray-avatar--ink">+3</span></span>
<div class="tray-row tray-row--sm" style="gap: var(--space-3)"><span class="tray-avatar">OF</span><div><p class="control">Oksana Franko</p><p class="caption tray-muted">Farm manager</p></div></div>
</div>
</body>
</html>
