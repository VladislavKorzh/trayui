<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Avatar — preview</title></head>
<body>
<div class="tray-demo">
<span class="tray-avatar tray-avatar--xs" role="img" aria-label="Dana Kovalenko">DK</span>
<span class="tray-avatar tray-avatar--sm" role="img" aria-label="Anna Melnyk">AM</span>
<span class="tray-avatar" role="img" aria-label="Bohdan Shevchuk">BS</span>
<span class="tray-avatar tray-avatar--lg" role="img" aria-label="Oksana Franko">OF</span>
<span class="tray-avatar tray-avatar--ink" role="img" aria-label="Dana Kovalenko, you">DK</span>
<span class="tray-avatar tray-avatar--accent" role="img" aria-label="Assistant"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-sparkle"/></svg></span>
<span class="tray-avatar" role="img" aria-label="No photo"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-user"/></svg></span>
<span class="tray-avatar-group" role="group" aria-label="Packing team, 6 people"><span class="tray-avatar" aria-hidden="true">AM</span><span class="tray-avatar" aria-hidden="true">BS</span><span class="tray-avatar" aria-hidden="true">OF</span><span class="tray-avatar tray-avatar--ink" aria-hidden="true">+3</span></span>
<button class="tray-avatar" type="button" aria-label="Account: Oksana Franko, OF">OF</button>
<div class="tray-row tray-row--sm" style="gap: var(--space-3)"><span class="tray-avatar" aria-hidden="true">OF</span><div><p class="control">Oksana Franko</p><p class="caption tray-muted">Farm manager</p></div></div>
</div>
</body>
</html>
