<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>UsageMeter — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<div class="tray-card tray-demo-fill" style="padding: var(--space-8); min-inline-size: 24rem">
<div class="tray-card__head"><div><h3 class="subtitle">Usage</h3><p class="tray-soft" style="font-size: 1rem">Shop plan. Resets on 1 December.</p></div><a class="tray-btn tray-btn--quiet tray-btn--xs" href="#">Change plan</a></div>
<div class="tray-usage">
<div class="tray-progress"><span class="tray-progress__name">Orders this month</span><span class="tray-progress__value">842 of 1,000</span><span class="tray-progress__bar" role="meter" aria-label="Orders this month" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="842" style="--tray-v: 84"></span></div>
<div class="tray-progress" data-level="high"><span class="tray-progress__name">Team seats</span><span class="tray-progress__value">5 of 5</span><span class="tray-progress__bar" role="meter" aria-label="Team seats" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5" style="--tray-v: 100"></span><span class="tray-progress__note"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-circle-alert"/></svg>Every seat is taken. Add seats to invite more people.</span></div>
<div class="tray-progress"><span class="tray-progress__name">Label storage</span><span class="tray-progress__value">1.2 of 5 GB</span><span class="tray-progress__bar" role="meter" aria-label="Label storage" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1.2" style="--tray-v: 24"></span></div>
<div class="tray-row tray-row--between"><span class="nav">API requests</span><span class="tray-soft" style="font-size: 1rem">Unlimited on this plan</span></div>
</div>
</div>
<div class="tray-stack" style="inline-size: 15rem">
<p class="tray-demo-note">In the foot of the sidebar</p>
<div class="tray-card" style="padding: var(--space-4); border-radius: var(--radius-panel)">
<div class="tray-usage tray-usage--sm"><div class="tray-progress"><span class="tray-progress__name">Orders</span><span class="tray-progress__value">842 of 1,000</span><span class="tray-progress__bar" role="meter" aria-label="Orders this month" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="842" style="--tray-v: 84"></span></div><a class="tray-btn tray-btn--link" href="#">Upgrade the plan</a></div>
</div>
</div>
</div>
</body>
</html>
