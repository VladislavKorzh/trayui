<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toggle — preview</title></head>
<body>
<div class="tray-demo">
<button class="tray-toggle tray-toggle--icon" type="button" data-tray="toggle" aria-pressed="true" aria-label="Bold"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-bold"/></svg></button>
<button class="tray-toggle tray-toggle--icon" type="button" data-tray="toggle" aria-pressed="false" aria-label="Italic"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-italic"/></svg></button>
<button class="tray-toggle" type="button" data-tray="toggle" aria-pressed="false"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-bookmark"/></svg>Pin</button>
<button class="tray-toggle" type="button" data-tray="toggle" aria-pressed="true"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-bell"/></svg>Notify me</button>
<button class="tray-toggle tray-toggle--icon" type="button" data-tray="toggle" aria-pressed="false" aria-label="Dark theme"><span data-when="off"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-moon"/></svg></span><span data-when="on"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-sun"/></svg></span></button>
<button class="tray-toggle tray-toggle--xs" type="button" data-tray="toggle" aria-pressed="false"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-star"/></svg>Favourite</button>
<button class="tray-toggle" type="button" aria-pressed="false" disabled><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-lock"/></svg>Locked</button>
</div>
</body>
</html>
