<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FilterBar — preview</title></head>
<body>
<div class="tray-demo tray-demo--col">
<div class="tray-filterbar" data-tray="filterbar">
<div class="tray-filterbar__row">
<div class="tray-input-group tray-input-group--sm"><span class="tray-input-group__addon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-search"/></svg></span><input class="tray-input" type="search" placeholder="Search orders" aria-label="Search orders"></div>
<span class="tray-anchor" data-tray="menu"><button class="tray-btn tray-btn--quiet tray-btn--sm" type="button">Status<svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-chevron-down"/></svg></button><div class="tray-pop"><div class="tray-list">
<button type="button" class="tray-option" role="menuitemcheckbox" aria-checked="true" data-value="status:to-pack" data-label="Status: To pack"><span class="tray-option__text">To pack</span><span class="tray-option__meta">12</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<button type="button" class="tray-option" role="menuitemcheckbox" aria-checked="false" data-value="status:courier" data-label="Status: With the courier"><span class="tray-option__text">With the courier</span><span class="tray-option__meta">7</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<button type="button" class="tray-option" role="menuitemcheckbox" aria-checked="false" data-value="status:delivered" data-label="Status: Delivered"><span class="tray-option__text">Delivered</span><span class="tray-option__meta">214</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<button type="button" class="tray-option" role="menuitemcheckbox" aria-checked="false" data-value="status:refunded" data-label="Status: Refunded"><span class="tray-option__text">Refunded</span><span class="tray-option__meta">3</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
</div></div></span>
<span class="tray-anchor" data-tray="menu"><button class="tray-btn tray-btn--quiet tray-btn--sm" type="button">Delivery<svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-chevron-down"/></svg></button><div class="tray-pop"><div class="tray-list">
<button type="button" class="tray-option" role="menuitemcheckbox" aria-checked="true" data-value="delivery:courier" data-label="Delivery: Courier"><span class="tray-option__text">Courier</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
<button type="button" class="tray-option" role="menuitemcheckbox" aria-checked="false" data-value="delivery:pickup" data-label="Delivery: Pickup"><span class="tray-option__text">Pickup</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button>
</div></div></span>
<div class="tray-filterbar__end">
<span class="tray-select tray-select--sm"><select aria-label="Sort by"><option>Newest first</option><option>Oldest first</option><option>Largest total</option></select></span>
<div class="tray-seg tray-seg--sm tray-seg--icon" role="radiogroup" aria-label="View"><label class="tray-seg__item"><input type="radio" name="fb-view" checked aria-label="List"><span><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-list"/></svg></span></label><label class="tray-seg__item"><input type="radio" name="fb-view" aria-label="Grid"><span><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-layout-grid"/></svg></span></label></div>
</div>
</div>
<div class="tray-filterbar__chips">
<span class="tray-chip" data-value="status:to-pack">Status: To pack<button type="button" class="tray-chip__x" aria-label="Remove Status: To pack"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-x"/></svg></button></span>
<span class="tray-chip" data-value="delivery:courier">Delivery: Courier<button type="button" class="tray-chip__x" aria-label="Remove Delivery: Courier"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-x"/></svg></button></span>
<button class="tray-btn tray-btn--link" type="button" data-filter="clear">Clear all</button>
</div>
</div>
<p class="tray-soft">12 orders match. Open "Status" to add a filter, or remove a chip.</p>
</div>
</body>
</html>
