<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Direction — preview</title></head>
<body>
<div class="tray-demo tray-demo--grid">
<div class="tray-card tray-stack" dir="ltr" lang="en" style="padding: var(--space-6)">
<p class="label tray-soft">Left to right</p>
<div class="tray-field"><label class="tray-label" for="dr1">City</label><div class="tray-input-group"><span class="tray-input-group__addon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-search"/></svg></span><input class="tray-input" id="dr1" value="Lviv"></div></div>
<label class="tray-switch tray-switch--row"><span class="tray-switch__text"><b>Gift box</b></span><input type="checkbox" role="switch" checked><span class="tray-switch__track"></span></label>
<div class="tray-row tray-row--between"><button class="tray-btn tray-btn--ghost tray-btn--sm" type="button"><svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-arrow-left"/></svg>Back</button><button class="tray-btn tray-btn--sm" type="button">Next<svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-arrow-right"/></svg></button></div>
</div>
<div class="tray-card tray-stack" dir="rtl" lang="ar" style="padding: var(--space-6)">
<p class="label tray-soft">من اليمين إلى اليسار</p>
<div class="tray-field"><label class="tray-label" for="dr2">المدينة</label><div class="tray-input-group"><span class="tray-input-group__addon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-search"/></svg></span><input class="tray-input" id="dr2" value="لفيف"></div></div>
<label class="tray-switch tray-switch--row"><span class="tray-switch__text"><b>علبة هدية</b></span><input type="checkbox" role="switch" checked><span class="tray-switch__track"></span></label>
<div class="tray-row tray-row--between"><button class="tray-btn tray-btn--ghost tray-btn--sm" type="button"><svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-arrow-left"/></svg>رجوع</button><button class="tray-btn tray-btn--sm" type="button">التالي<svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-arrow-right"/></svg></button></div>
</div>
</div>
</body>
</html>
