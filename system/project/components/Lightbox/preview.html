<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lightbox — preview</title></head>
<body>
<div class="tray-demo tray-demo--col">
<ul class="tray-gallery tray-gallery--lead" data-tray="lightbox" data-target="#farm-pictures" aria-label="The farm in pictures" style="--tray-thumb: 15rem">
<li><a class="tray-gallery__item" href="../../assets/Media/beds.webp" data-caption="Open-air snail beds on a hillside. Each bed is fenced with fine net, so the snails stay in."><img src="../../assets/Media/beds-thumb.webp" alt="Rows of leafy green snail beds on a hillside, each fenced with black net, a metal fence in front" width="640" height="415" loading="lazy" decoding="async"></a></li>
<li><a class="tray-gallery__item" href="../../assets/Media/snail.webp" data-caption="A garden snail out on a wet leaf: snails come out after rain."><img src="../../assets/Media/snail-thumb.webp" alt="A brown-striped garden snail crawling along a wet green leaf" width="640" height="480" loading="lazy" decoding="async"></a></li>
<li><a class="tray-gallery__item" href="../../assets/Media/sieve.webp" data-caption="Trout eggs firming up in a tray of water. Snail eggs are smaller and whiter."><img src="../../assets/Media/sieve-thumb.webp" alt="Thousands of pale trout eggs under water in a cream plastic tray" width="480" height="640" loading="lazy" decoding="async"></a></li>
<li><a class="tray-gallery__item" href="../../assets/Media/jar.webp" data-caption="A small jar of caviar kept on crushed ice, with crackers, brie and pâté."><img src="../../assets/Media/jar-thumb.webp" alt="A small jar of black caviar on crushed ice in a glass dish, crackers, brie and pâté beside it" width="640" height="480" loading="lazy" decoding="async"></a></li>
<li><a class="tray-gallery__item" href="../../assets/Media/spoon.webp" data-caption="Salmon roe with a spoon in it. Serve any roe cold, a spoonful at a time."><img src="../../assets/Media/spoon-thumb.webp" alt="Glossy orange salmon roe in a bowl, a teaspoon resting in it" width="640" height="480" loading="lazy" decoding="async"></a></li>
<li><a class="tray-gallery__item" href="../../assets/Media/shop.webp" data-caption="An old country shop: a long counter, a brass scale, and shelves of jars and tins."><img src="../../assets/Media/shop-thumb.webp" alt="The counter of an old country shop: a brass scale, barrels underneath, shelves of jars, tins and bottles behind" width="640" height="426" loading="lazy" decoding="async"></a></li>
</ul>
<dialog class="tray-lightbox" id="farm-pictures" data-tray="dialog" aria-label="The farm in pictures" data-of="of">
<div class="tray-lightbox__bar"><span class="tray-lightbox__count" aria-hidden="true">1 / 6</span><button class="tray-btn tray-btn--quiet tray-btn--icon" type="button" data-close aria-label="Close"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-x"/></svg></button></div>
<div class="tray-lightbox__nav"><button class="tray-btn tray-btn--icon" type="button" data-prev aria-label="Previous picture"><svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-chevron-left"/></svg></button><button class="tray-btn tray-btn--icon" type="button" data-next aria-label="Next picture"><svg class="tray-icon tray-icon--flip" aria-hidden="true"><use href="#tray-i-chevron-right"/></svg></button></div>
<ul class="tray-lightbox__track" aria-label="Pictures"></ul>
<p class="tray-vh" role="status"></p>
</dialog>
</div>
</body>
</html>
