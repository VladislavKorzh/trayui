<!-- @dsCard group="Overlays" height=212 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tooltip — preview</title></head>
<body>
<div class="tray-demo" style="padding-block-end: var(--space-16)">
<span class="tray-demo-note" style="margin-block-end: var(--space-10)">Point at a button, or move to it with Tab. Two are held open here.</span>
<span class="tray-anchor" data-tray="tooltip" data-tip="Copy the link" data-open style="margin-inline-start: var(--space-10)"><button class="tray-btn tray-btn--quiet tray-btn--sm tray-btn--icon" type="button" aria-label="Copy the link"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-copy"/></svg></button></span>
<span class="tray-anchor" data-tray="tooltip" data-tip="Download the receipt"><button class="tray-btn tray-btn--quiet tray-btn--sm tray-btn--icon" type="button" aria-label="Download the receipt"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-download"/></svg></button></span>
<span class="tray-anchor" data-tray="tooltip" data-tip="Search" data-keys="Ctrl K" data-side="bottom" data-open style="margin-inline: var(--space-12)"><button class="tray-btn tray-btn--quiet tray-btn--sm tray-btn--icon" type="button" aria-label="Search"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-search"/></svg></button></span>
<span class="tray-anchor" data-tray="tooltip" data-tip="Dark theme"><button class="tray-toggle tray-toggle--icon" type="button" data-tray="toggle" aria-pressed="false" aria-label="Dark theme"><span data-when="off"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-moon"/></svg></span><span data-when="on"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-sun"/></svg></span></button></span>
</div>
</body>
</html>
