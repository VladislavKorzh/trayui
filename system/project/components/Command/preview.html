<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Command — preview</title></head>
<body>
<div class="tray-demo tray-demo--center">
<div class="tray-command" data-tray="command">
<label class="tray-command__search"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-search"/></svg><input placeholder="Search or run a command" aria-label="Command"></label>
<div class="tray-command__list">
<div data-group><div class="tray-list__label">Go to</div><button type="button" class="tray-option" role="option"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-inbox"/></svg><span class="tray-option__text">Orders</span><span class="tray-option__meta tray-keys"><kbd class="tray-kbd">G</kbd><kbd class="tray-kbd">O</kbd></span></button><button type="button" class="tray-option" role="option"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-shopping-bag"/></svg><span class="tray-option__text">Batches</span><span class="tray-option__meta tray-keys"><kbd class="tray-kbd">G</kbd><kbd class="tray-kbd">B</kbd></span></button><button type="button" class="tray-option" role="option"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-pencil"/></svg><span class="tray-option__text">Field notes</span></button></div>
<div data-group><div class="tray-list__label">Actions</div><button type="button" class="tray-option" role="option"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-plus"/></svg><span class="tray-option__text">Create an order</span><span class="tray-option__meta tray-keys"><kbd class="tray-kbd">Ctrl</kbd><kbd class="tray-kbd">N</kbd></span></button><button type="button" class="tray-option" role="option"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-download"/></svg><span class="tray-option__text">Export orders</span></button><button type="button" class="tray-option" role="option"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-moon"/></svg><span class="tray-option__text">Switch to the dark theme</span></button></div>
<div class="tray-list__empty" hidden>Nothing matches. Try another word.</div>
</div>
<div class="tray-command__foot"><span><kbd class="tray-kbd">↑</kbd><kbd class="tray-kbd">↓</kbd> to move</span><span><kbd class="tray-kbd">Enter</kbd> to run</span><span><kbd class="tray-kbd">Esc</kbd> to close</span></div>
</div>
</div>
</body>
</html>
