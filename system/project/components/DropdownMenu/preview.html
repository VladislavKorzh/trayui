<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DropdownMenu — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<span class="tray-anchor" data-tray="menu"><button class="tray-btn tray-btn--quiet tray-btn--sm" type="button">Actions<svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-chevron-down"/></svg></button><div class="tray-pop" data-open><div class="tray-list"><button type="button" class="tray-option" role="menuitem"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-external-link"/></svg><span class="tray-option__text">Open</span><span class="tray-option__meta">Enter</span></button><button type="button" class="tray-option" role="menuitem"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-copy"/></svg><span class="tray-option__text">Duplicate</span><span class="tray-option__meta">Ctrl D</span></button><button type="button" class="tray-option" role="menuitem"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-link"/></svg><span class="tray-option__text">Copy the link</span></button><hr class="tray-list__rule"><button type="button" class="tray-option" role="menuitemcheckbox" aria-checked="true"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-bell"/></svg><span class="tray-option__text">Notify the customer</span><svg class="tray-icon tray-option__check" aria-hidden="true"><use href="#tray-i-check"/></svg></button><div class="tray-submenu"><button type="button" class="tray-option" role="menuitem" aria-haspopup="menu"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-folder"/></svg><span class="tray-option__text">Move to</span><svg class="tray-icon tray-icon--flip tray-icon--sm" aria-hidden="true"><use href="#tray-i-chevron-right"/></svg></button><div class="tray-pop tray-pop--side"><div class="tray-list"><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">Packed</span></button><button type="button" class="tray-option" role="menuitem"><span class="tray-option__text">On hold</span></button></div></div></div><hr class="tray-list__rule"><button type="button" class="tray-option tray-option--danger" role="menuitem"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-trash-2"/></svg><span class="tray-option__text">Delete order</span></button></div></div></span>
<span class="tray-anchor" data-tray="menu" style="margin-inline-start: auto"><button class="tray-btn tray-btn--ghost tray-btn--sm tray-btn--icon" type="button" aria-label="More actions"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-ellipsis"/></svg></button><div class="tray-pop tray-pop--end"><div class="tray-list"><button type="button" class="tray-option" role="menuitem"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-pencil"/></svg><span class="tray-option__text">Edit</span></button><button type="button" class="tray-option" role="menuitem"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-inbox"/></svg><span class="tray-option__text">Archive</span></button></div></div></span>
</div>
</body>
</html>
