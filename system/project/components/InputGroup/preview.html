<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>InputGroup — preview</title></head>
<body>
<div class="tray-demo tray-demo--grid">
<div class="tray-input-group"><span class="tray-input-group__addon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-search"/></svg></span><input class="tray-input" type="search" placeholder="Search orders" aria-label="Search orders"><span class="tray-input-group__addon"><kbd class="tray-kbd">/</kbd></span></div>
<div class="tray-input-group"><span class="tray-input-group__addon">https://</span><input class="tray-input" value="perly.example/notes" aria-label="Page address"><button class="tray-input-group__btn" type="button" aria-label="Copy the address"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-copy"/></svg></button></div>
<div class="tray-input-group"><input class="tray-input" inputmode="decimal" value="2.5" aria-label="Weight"><span class="tray-input-group__addon">kg</span></div>
<div class="tray-input-group"><span class="tray-input-group__addon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-lock"/></svg></span><input class="tray-input" type="password" spellcheck="false" autocapitalize="none" value="example-password" aria-label="Password"><button class="tray-input-group__btn" type="button" data-tray="reveal" aria-label="Show password"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-eye"/></svg></button></div>
<div class="tray-input-group"><input class="tray-input" placeholder="Promo code" aria-label="Promo code"><button class="tray-input-group__btn tray-input-group__btn--accent" type="button">Apply</button></div>
<div class="tray-input-group tray-input-group--sm"><span class="tray-input-group__addon"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-filter"/></svg></span><input class="tray-input" placeholder="Filter" aria-label="Filter"></div>
</div>
</body>
</html>
