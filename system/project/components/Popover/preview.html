<!-- @dsCard group="Overlays" height=323 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Popover — preview</title></head>
<body>
<div class="tray-demo tray-demo--start">
<span class="tray-anchor" data-tray="popover">
<button class="tray-btn tray-btn--quiet tray-btn--sm" type="button"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-share"/></svg>Share</button>
<div class="tray-pop tray-pop--card" data-open><div class="tray-stack">
<div class="tray-stack tray-stack--sm"><p class="tray-pop__title">Share this note</p><p class="tray-pop__text">Anyone with the link can read it.</p></div>
<div class="tray-input-group tray-input-group--sm"><input class="tray-input" value="perly.example/notes/may-peak" aria-label="Link" readonly><button class="tray-input-group__btn" type="button" aria-label="Copy the link"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-copy"/></svg></button></div>
<label class="tray-switch"><input type="checkbox" role="switch" checked><span class="tray-switch__track"></span><span>Show the figures table</span></label>
</div></div>
</span>
<span class="tray-anchor" data-tray="popover" style="margin-inline-start: auto">
<button class="tray-btn tray-btn--ghost tray-btn--sm tray-btn--icon" type="button" aria-label="What is a batch?"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-circle-help"/></svg></button>
<div class="tray-pop tray-pop--card tray-pop--end"><div class="tray-stack tray-stack--sm"><p class="tray-pop__title">Batch</p><p class="tray-pop__text">Everything packed from one collection. The autumn batch was 412 jars.</p></div></div>
</span>
</div>
</body>
</html>
