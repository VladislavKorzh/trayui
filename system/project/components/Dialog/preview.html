<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body>
<div class="tray-demo tray-demo--col">
<div><button class="tray-btn tray-btn--quiet tray-btn--sm" type="button" data-tray="open" data-target="#dlg-real">Open it over the page</button></div>
<div class="tray-stage tray-stage--scrim">
<dialog class="tray-dialog" open data-tray="dialog" aria-labelledby="dlg-t">
<div class="tray-dialog__head"><div><h2 class="title" id="dlg-t">Change the delivery day</h2><p class="tray-dialog__text">Order PL-20418 is not packed yet, so the day can still move.</p></div><button class="tray-btn tray-btn--ghost tray-btn--xs tray-btn--icon" type="button" data-close aria-label="Close"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-x"/></svg></button></div>
<div class="tray-dialog__body"><div class="tray-field"><label class="tray-label" for="dlg-day">New day</label><span class="tray-select"><select id="dlg-day"><option>Tomorrow, 16 November</option><option>Tuesday, 17 November</option><option>Wednesday, 18 November</option></select></span></div></div>
<div class="tray-dialog__foot"><button class="tray-btn tray-btn--ghost tray-btn--md" type="button" data-close>Cancel</button><button class="tray-btn tray-btn--md" type="button" data-close value="save">Save the day</button></div>
</dialog>
</div>
<dialog class="tray-dialog tray-dialog--sm" id="dlg-real" data-tray="dialog" aria-labelledby="dlg-rt">
<div class="tray-dialog__head"><div><h2 class="title" id="dlg-rt">Leave a note</h2></div><button class="tray-btn tray-btn--ghost tray-btn--xs tray-btn--icon" type="button" data-close aria-label="Close"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-x"/></svg></button></div>
<div class="tray-dialog__body"><div class="tray-field"><label class="tray-label" for="dlg-note">For the courier</label><textarea class="tray-textarea" id="dlg-note" rows="3"></textarea></div></div>
<div class="tray-dialog__foot"><button class="tray-btn tray-btn--ghost tray-btn--md" type="button" data-close>Cancel</button><button class="tray-btn tray-btn--md" type="button" data-close value="save">Save the note</button></div>
</dialog>
</div>
</body>
</html>
