<!-- @dsCard group="Display" height=204 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div class="tray-demo">
<span class="tray-badge">Draft</span>
<span class="tray-badge tray-badge--accent">In season</span>
<span class="tray-badge tray-badge--ink">New</span>
<span class="tray-badge tray-badge--off">Out of season</span>
<span class="tray-badge tray-badge--success"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-circle-check"/></svg>Paid</span>
<span class="tray-badge tray-badge--danger"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-circle-alert"/></svg>Payment failed</span>
<span class="tray-badge tray-badge--ink tray-badge--count">12<span class="tray-vh"> orders to pack</span></span>
<span class="tray-badge tray-badge--count">3<span class="tray-vh"> unread messages</span></span>
<p class="tray-demo-note">Chips state facts; on a tray they turn white</p>
<span class="tray-chip">30 g</span><span class="tray-chip">Chilled</span><span class="tray-chip"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-truck"/></svg>Courier</span>
<span class="tray-chip">Kyiv<button class="tray-chip__x" type="button" aria-label="Remove the filter Kyiv"><svg class="tray-icon tray-icon--sm" aria-hidden="true"><use href="#tray-i-x"/></svg></button></span>
<div class="tray-card" style="padding: var(--space-4) var(--space-5)"><div class="tray-row tray-row--sm"><span class="tray-chip">Pickup</span><span class="tray-badge">Draft</span><span class="tray-badge tray-badge--accent">Ready</span></div></div>
</div>
</body>
</html>
