<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sheet — preview</title></head>
<body>
<div class="tray-demo tray-demo--col">
<div class="tray-stage tray-stage--scrim" style="min-block-size: 34rem">
<dialog class="tray-sheet" open data-tray="dialog" aria-labelledby="sh-t">
<div class="tray-dialog__head"><div><h2 class="title" id="sh-t">Filters</h2></div><button class="tray-btn tray-btn--ghost tray-btn--xs tray-btn--icon" type="button" data-close aria-label="Close"><svg class="tray-icon" aria-hidden="true"><use href="#tray-i-x"/></svg></button></div>
<div class="tray-dialog__body">
<fieldset><legend class="tray-label">Status</legend><div class="tray-stack" style="gap: 0"><label class="tray-check"><input type="checkbox" checked><span class="tray-check__box"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="tray-check__tick" d="M4 10.5l4 4 8-9"/><path class="tray-check__dash" d="M5 10h10"/></svg></span><span>Paid</span></label><label class="tray-check"><input type="checkbox" checked><span class="tray-check__box"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="tray-check__tick" d="M4 10.5l4 4 8-9"/><path class="tray-check__dash" d="M5 10h10"/></svg></span><span>Pay on delivery</span></label><label class="tray-check"><input type="checkbox"><span class="tray-check__box"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="tray-check__tick" d="M4 10.5l4 4 8-9"/><path class="tray-check__dash" d="M5 10h10"/></svg></span><span>Payment failed</span></label></div></fieldset>
<div class="tray-field"><span class="tray-label" id="sh-p">Placed</span><div class="tray-seg tray-seg--sm tray-seg--fill" role="radiogroup" aria-labelledby="sh-p"><label class="tray-seg__item"><input type="radio" name="shp"><span>Today</span></label><label class="tray-seg__item"><input type="radio" name="shp" checked><span>Week</span></label><label class="tray-seg__item"><input type="radio" name="shp"><span>Month</span></label></div></div>
<label class="tray-switch tray-switch--row"><span class="tray-switch__text"><b>Gift boxes only</b></span><input type="checkbox" role="switch"><span class="tray-switch__track"></span></label>
</div>
<div class="tray-dialog__foot"><button class="tray-btn tray-btn--ghost tray-btn--md" type="button">Clear</button><button class="tray-btn tray-btn--dark tray-btn--md" type="button" data-close>Show 8 orders</button></div>
</dialog>
</div>
</div>
</body>
</html>
