<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The chart: a raised panel, one series in ink on a strong baseline -->
  <rect x="32" y="32" width="286" height="206" rx="18" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <!-- The column the keyboard has reached: a quiet band behind its bar -->
  <rect x="151" y="56" width="46" height="116" rx="8" style="fill:var(--surface)"/>
  <g style="fill:var(--ink)">
    <path d="M64.4 172v-22.9a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4V172z"/>
    <path d="M113.2 172v-58.7a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4V172z"/>
    <path d="M162 172v-94.6a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4V172z"/>
    <path d="M210.8 172v-81.1a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4V172z"/>
    <path d="M259.6 172v-36.3a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4V172z"/>
  </g>
  <path d="M52 172h244" style="fill:none;stroke:var(--rule-strong);stroke-width:1.5"/>
  <!-- The plot has focus: a 3px ink ring -->
  <rect x="44.5" y="44.5" width="259" height="137" rx="10" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <!-- The tooltip at the point in focus -->
  <rect x="192" y="51" width="107" height="32" rx="8" style="fill:var(--inverse);stroke:var(--hairline);stroke-width:1"/>
  <text x="201" y="73" style="fill:var(--on-inverse);font:600 17px var(--font-sans)">May, 22 kg</text>
  <!-- The same figures as a table, behind a disclosure -->
  <path d="M46 198h256" style="fill:none;stroke:var(--hairline);stroke-width:1.5"/>
  <text x="50" y="227" style="fill:var(--ink);font:500 17px var(--font-sans)">Show the figures</text>
  <rect x="272" y="205" width="28" height="28" rx="8" style="fill:var(--surface)"/>
  <path transform="translate(274 207)" d="M5 12h14M12 5v14" style="fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round"/>
  <!-- What the arrow keys reach is said aloud -->
  <circle cx="383" cy="92" r="40" style="fill:var(--accent)"/>
  <g transform="translate(351.8 60.8) scale(2.6)" style="fill:none;stroke:var(--on-accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">
    <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
    <path d="M16 9a5 5 0 0 1 0 6"/>
    <path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>
  </g>
  <!-- The keys that walk the points -->
  <rect x="328" y="166" width="50" height="50" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <rect x="388" y="166" width="50" height="50" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <g style="fill:none;stroke:var(--ink);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round">
    <path transform="translate(341 179)" d="m12 19-7-7 7-7M19 12H5"/>
    <path transform="translate(401 179)" d="M5 12h14m-7-7 7 7-7 7"/>
  </g>
</svg>
