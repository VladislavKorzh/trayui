<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The index: llms.txt, a raised panel with the site's name and a list of pages, one of them chosen -->
  <rect x="32" y="32" width="200" height="206" rx="18" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="52" y="62" style="fill:var(--ink-muted);font:500 15px var(--font-mono)">llms.txt</text>
  <path d="M33 78h198" style="stroke:var(--hairline);stroke-width:1.5"/>
  <text x="52" y="110" style="fill:var(--ink);font:700 17px var(--font-mono)"># Tray UI</text>
  <rect x="42" y="126" width="180" height="34" rx="9" style="fill:var(--surface)"/>
  <g style="font:500 16px var(--font-mono)">
    <text x="52" y="148" style="fill:var(--ink)">- Button</text>
    <text x="52" y="186" style="fill:var(--ink-soft)">- Select</text>
    <text x="52" y="220" style="fill:var(--ink-soft)">- Dialog</text>
  </g>
  <!-- The link it follows -->
  <path d="M236 143h28m-8-8 8 8-8 8" style="fill:none;stroke:var(--ink-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- The page as Markdown: its title and its text, marked .md on the accent -->
  <rect x="272" y="44" width="176" height="182" rx="16" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <rect x="288" y="60" width="50" height="28" rx="8" style="fill:var(--accent)"/>
  <text x="313" y="79" text-anchor="middle" style="fill:var(--on-accent);font:700 15px var(--font-mono)">.md</text>
  <text x="288" y="122" style="fill:var(--ink);font:700 17px var(--font-mono)"># Button</text>
  <g style="fill:var(--track)">
    <rect x="288" y="140" width="142" height="10" rx="5"/>
    <rect x="288" y="160" width="118" height="10" rx="5"/>
    <rect x="288" y="180" width="134" height="10" rx="5"/>
    <rect x="288" y="200" width="88" height="10" rx="5"/>
  </g>
</svg>
