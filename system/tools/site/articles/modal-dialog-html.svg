<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The page behind the dialog: faint, because it is inert while the dialog is open -->
  <g style="opacity:.5">
    <rect x="32" y="32" width="96" height="14" rx="7" style="fill:var(--track)"/>
    <rect x="32" y="64" width="64" height="40" rx="20" style="fill:none;stroke:var(--rule-strong);stroke-width:2"/>
    <rect x="32" y="124" width="72" height="12" rx="6" style="fill:var(--track)"/>
    <rect x="32" y="148" width="56" height="12" rx="6" style="fill:var(--track)"/>
    <rect x="32" y="172" width="80" height="12" rx="6" style="fill:var(--track)"/>
    <rect x="32" y="196" width="48" height="12" rx="6" style="fill:var(--track)"/>
    <rect x="32" y="220" width="68" height="12" rx="6" style="fill:var(--track)"/>
  </g>
  <!-- The dialog: a raised panel with its title, the field that has focus, and the two buttons -->
  <rect x="136" y="32" width="236" height="206" rx="24" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="160" y="70" style="fill:var(--ink);font:600 18px var(--font-sans)">Leave a note</text>
  <path d="M340 54 328 66m0-12 12 12" style="fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round"/>
  <rect x="160" y="88" width="188" height="64" rx="14" style="fill:var(--surface)"/>
  <rect x="158.5" y="86.5" width="191" height="67" rx="15.5" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <path d="M176 104v18" style="stroke:var(--ink);stroke-width:2;stroke-linecap:round"/>
  <rect x="160" y="176" width="84" height="40" rx="20" style="fill:var(--surface)"/>
  <text x="202" y="201" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--font-sans)">Cancel</text>
  <rect x="252" y="176" width="96" height="40" rx="20" style="fill:var(--accent)"/>
  <text x="300" y="201" text-anchor="middle" style="fill:var(--on-accent);font:600 15px var(--font-sans)">Save</text>
  <!-- The key that closes it -->
  <rect x="388" y="32" width="60" height="48" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <text x="418" y="62" text-anchor="middle" style="fill:var(--ink-soft);font:500 16px var(--font-mono)">Esc</text>
</svg>
