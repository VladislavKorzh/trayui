<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The checklist: a raised panel of criteria, each a Tray UI checkbox -->
  <rect x="32" y="32" width="296" height="206" rx="18" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <g style="fill:none;stroke:var(--hairline);stroke-width:1.5">
    <path d="M48 85.5h264"/>
    <path d="M48 135.5h264"/>
    <path d="M48 185.5h264"/>
  </g>
  <!-- Three checked boxes: ink with a tick in the colour of the page -->
  <g style="fill:var(--ink)">
    <rect x="52" y="46" width="26" height="26" rx="6"/>
    <rect x="52" y="96" width="26" height="26" rx="6"/>
    <rect x="52" y="146" width="26" height="26" rx="6"/>
  </g>
  <g style="fill:none;stroke:var(--page);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round">
    <path transform="translate(55 49) scale(.83)" d="M20 6 9 17l-5-5"/>
    <path transform="translate(55 99) scale(.83)" d="M20 6 9 17l-5-5"/>
    <path transform="translate(55 149) scale(.83)" d="M20 6 9 17l-5-5"/>
  </g>
  <!-- The one being checked now: an empty box with the focus ring -->
  <rect x="52.75" y="196.75" width="24.5" height="24.5" rx="5.5" style="fill:var(--surface);stroke:var(--ink-hint);stroke-width:1.5"/>
  <rect x="47.5" y="191.5" width="35" height="35" rx="9" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <g style="fill:var(--ink-muted);font:500 16px var(--font-mono)">
    <text x="96" y="65">1.4.3</text>
    <text x="96" y="115">2.1.1</text>
    <text x="96" y="165">2.4.11</text>
    <text x="96" y="215">2.5.8</text>
  </g>
  <g style="fill:var(--ink);font:500 17px var(--font-sans)">
    <text x="172" y="65">Contrast</text>
    <text x="172" y="115">Keyboard</text>
    <text x="172" y="165">Focus</text>
    <text x="172" y="215">Target size</text>
  </g>
  <!-- The level it aims at, in the accent -->
  <circle cx="396" cy="135" r="52" style="fill:var(--accent)"/>
  <text x="396" y="148" text-anchor="middle" style="fill:var(--on-accent);font:700 36px var(--font-sans)">AA</text>
</svg>
