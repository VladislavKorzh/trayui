<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <g transform="translate(0 -18)">
  <!-- Before: focus on "One more", the button about to reach its limit -->
  <text x="40" y="84" style="fill:var(--ink-muted);font:500 15px var(--font-sans)">Quantity</text>
  <rect x="40" y="100" width="168" height="64" rx="18" style="fill:var(--surface)"/>
  <rect x="46" y="106" width="52" height="52" rx="13" style="fill:var(--page)"/>
  <text x="124" y="140" text-anchor="middle" style="fill:var(--ink);font:600 20px var(--font-sans)">8</text>
  <rect x="150" y="106" width="52" height="52" rx="13" style="fill:var(--page)"/>
  <rect x="146.5" y="102.5" width="59" height="59" rx="16" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <g style="fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round">
    <path transform="translate(60 120)" d="M5 12h14"/>
    <path transform="translate(164 120)" d="M5 12h14M12 5v14"/>
  </g>
  <!-- The press that reaches the limit -->
  <path d="M222 132h28m-8-8 8 8-8 8" style="fill:none;stroke:var(--ink-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- After: "One more" is disabled, and focus has moved to the group around it -->
  <text x="272" y="84" style="fill:var(--ink-muted);font:500 15px var(--font-sans)">Quantity</text>
  <rect x="272" y="100" width="168" height="64" rx="18" style="fill:var(--surface)"/>
  <rect x="268.5" y="96.5" width="175" height="71" rx="21.5" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <rect x="278" y="106" width="52" height="52" rx="13" style="fill:var(--page)"/>
  <text x="356" y="140" text-anchor="middle" style="fill:var(--ink);font:600 20px var(--font-sans)">9</text>
  <rect x="382" y="106" width="52" height="52" rx="13" style="fill:var(--page);opacity:.45"/>
  <g style="fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round">
    <path transform="translate(292 120)" d="M5 12h14" style="stroke:var(--ink)"/>
    <path transform="translate(396 120)" d="M5 12h14M12 5v14" style="stroke:var(--ink-hint)"/>
  </g>
  <!-- What the quantity is for -->
  <rect x="272" y="190" width="168" height="48" rx="24" style="fill:var(--accent)"/>
  <text x="356" y="220" text-anchor="middle" style="fill:var(--on-accent);font:600 17px var(--font-sans)">Add to cart</text>
  </g>
</svg>
