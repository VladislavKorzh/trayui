<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The trigger: the accent button, open, its chevron turned up -->
  <rect x="44" y="40" width="176" height="48" rx="24" style="fill:var(--accent)"/>
  <text x="72" y="70" style="fill:var(--on-accent);font:600 19px var(--font-sans)">Actions</text>
  <path d="m180 68 8-8 8 8" style="fill:none;stroke:var(--on-accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- The menu under it: a raised panel, the item with focus filled and ringed -->
  <rect x="44" y="102" width="250" height="160" rx="18" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="68" y="138" style="fill:var(--ink);font:500 17px var(--font-sans)">Duplicate</text>
  <rect x="54" y="152" width="230" height="40" rx="10" style="fill:var(--surface)"/>
  <rect x="55.5" y="153.5" width="227" height="37" rx="9" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <text x="68" y="178" style="fill:var(--ink);font:500 17px var(--font-sans)">Archive</text>
  <path d="M54 205h230" style="stroke:var(--hairline);stroke-width:1.5"/>
  <text x="68" y="238" style="fill:var(--danger);font:500 17px var(--font-sans)">Delete order</text>
  <!-- The keys that move through it and close it -->
  <rect x="332" y="92" width="104" height="50" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <text x="384" y="123" text-anchor="middle" style="fill:var(--ink-soft);font:500 17px var(--font-mono)">Esc</text>
  <rect x="332" y="156" width="48" height="50" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <rect x="388" y="156" width="48" height="50" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <g style="fill:none;stroke:var(--ink);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round">
    <path transform="translate(344 169)" d="m5 12 7-7 7 7M12 19V5"/>
    <path transform="translate(400 169)" d="M12 5v14m7-7-7 7-7-7"/>
  </g>
</svg>
