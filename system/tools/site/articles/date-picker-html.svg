<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The trigger, with the picked date in it -->
  <rect x="32" y="28" width="148" height="48" rx="16" style="fill:var(--surface)"/>
  <g transform="translate(44 40)" style="fill:none;stroke:var(--ink-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>
  </g>
  <text x="78" y="58" style="fill:var(--ink);font:600 17px var(--font-sans)">22 Nov</text>
  <!-- The keys that turn the month -->
  <rect x="32" y="102" width="148" height="50" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <text x="106" y="132" text-anchor="middle" style="fill:var(--ink-soft);font:500 16px var(--font-mono)">Page Up</text>
  <rect x="32" y="166" width="148" height="50" rx="12" style="fill:var(--accent)"/>
  <text x="106" y="196" text-anchor="middle" style="fill:var(--on-accent);font:600 16px var(--font-mono)">Page Down</text>
  <!-- The calendar: month buttons, the month, and its days -->
  <rect x="196" y="28" width="252" height="214" rx="18" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <g style="fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <path transform="translate(208 41)" d="m15 18-6-6 6-6"/>
    <path transform="translate(412 41)" d="m9 18 6-6-6-6"/>
  </g>
  <text x="322" y="59" text-anchor="middle" style="fill:var(--ink);font:600 17px var(--font-sans)">November</text>
  <rect x="404.7" y="169" width="30" height="30" rx="10" style="fill:var(--ink)"/>
  <rect x="274.4" y="203.5" width="30" height="30" rx="10" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <g text-anchor="middle" style="fill:var(--ink-hint);font:600 13px var(--font-sans)">
    <text x="224.3" y="88">M</text>
    <text x="256.9" y="88">T</text>
    <text x="289.4" y="88">W</text>
    <text x="322.0" y="88">T</text>
    <text x="354.6" y="88">F</text>
    <text x="387.1" y="88">S</text>
    <text x="419.7" y="88">S</text>
  </g>
  <g text-anchor="middle" style="fill:var(--ink);font:500 15px var(--font-sans)">
    <text x="224.3" y="120">2</text>
    <text x="256.9" y="120">3</text>
    <text x="289.4" y="120">4</text>
    <text x="322.0" y="120">5</text>
    <text x="354.6" y="120">6</text>
    <text x="387.1" y="120">7</text>
    <text x="419.7" y="120">8</text>
    <text x="224.3" y="154">9</text>
    <text x="256.9" y="154">10</text>
    <text x="289.4" y="154">11</text>
    <text x="322.0" y="154">12</text>
    <text x="354.6" y="154">13</text>
    <text x="387.1" y="154">14</text>
    <text x="419.7" y="154">15</text>
    <text x="224.3" y="189">16</text>
    <text x="256.9" y="189">17</text>
    <text x="289.4" y="189">18</text>
    <text x="322.0" y="189">19</text>
    <text x="354.6" y="189">20</text>
    <text x="387.1" y="189">21</text>
    <text x="224.3" y="224">23</text>
    <text x="256.9" y="224">24</text>
    <text x="289.4" y="224">25</text>
    <text x="322.0" y="224">26</text>
    <text x="354.6" y="224">27</text>
