<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The theme menu: one stylesheet, a choice of themes, the chosen one filled and ticked -->
  <rect x="32" y="34" width="180" height="202" rx="20" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <rect x="42" y="94" width="160" height="42" rx="12" style="fill:var(--surface)"/>
  <g style="fill:var(--ink);font:500 17px var(--font-sans)">
    <text x="60" y="76">Light</text>
    <text x="60" y="121">Dark</text>
    <text x="60" y="166">Midnight</text>
    <text x="60" y="210">Forest</text>
  </g>
  <path transform="translate(166 103)" d="M20 6 9 17l-5-5" style="fill:none;stroke:var(--ink);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- A page in that theme, with a part of it in a theme of its own: the ink card inside the page -->
  <rect x="234" y="34" width="214" height="202" rx="22" style="fill:var(--page);stroke:var(--rule-strong);stroke-width:1.5"/>
  <rect x="252" y="52" width="178" height="70" rx="16" style="fill:var(--surface)"/>
  <text x="270" y="84" style="fill:var(--ink);font:600 17px var(--font-sans)">Aa</text>
  <rect x="270" y="98" width="120" height="10" rx="5" style="fill:var(--ink-hint)"/>
  <rect x="252" y="134" width="178" height="84" rx="16" style="fill:var(--inverse)"/>
  <text x="270" y="166" style="fill:var(--on-inverse);font:600 17px var(--font-sans)">Aa</text>
  <rect x="270" y="180" width="64" height="24" rx="12" style="fill:var(--accent)"/>
  <rect x="344" y="187" width="66" height="10" rx="5" style="fill:var(--inverse-off)"/>
</svg>
