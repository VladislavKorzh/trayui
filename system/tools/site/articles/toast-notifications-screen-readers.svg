<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- What a screen reader does with the toast: it says it -->
  <circle cx="122" cy="135" r="66" style="fill:var(--accent)"/>
  <g transform="translate(83.6 96.6) scale(3.2)" style="fill:none;stroke:var(--on-accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">
    <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
    <path d="M16 9a5 5 0 0 1 0 6"/>
    <path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>
  </g>
  <!-- The live region, in the page before any toast, and the toasts that arrive in it -->
  <rect x="220" y="34" width="226" height="202" rx="24" style="fill:none;stroke:var(--rule-strong);stroke-width:2;stroke-dasharray:7 7"/>
  <text x="240" y="64" style="fill:var(--ink-muted);font:500 14px var(--font-mono)">role="status"</text>
  <g style="opacity:.55">
    <rect x="240" y="82" width="186" height="56" rx="14" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
    <circle cx="263" cy="110" r="9" style="fill:none;stroke:var(--ink-hint);stroke-width:2"/>
    <rect x="282" y="104" width="112" height="12" rx="6" style="fill:var(--track)"/>
  </g>
  <rect x="234" y="150" width="198" height="66" rx="14" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <g transform="translate(248 166)" style="fill:none;stroke:var(--success);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <circle cx="12" cy="12" r="10"/>
    <path d="m9 12 2 2 4-4"/>
  </g>
  <text x="282" y="181" style="fill:var(--ink);font:600 15px var(--font-sans)">Order archived</text>
  <text x="282" y="201" style="fill:var(--ink-soft);font:500 14px var(--font-sans)">Undo</text>
</svg>
