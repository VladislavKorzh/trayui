<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The segmented control: a tray of three segments, the pill sliding from the old choice to the new one -->
  <rect x="36" y="40" width="408" height="84" rx="22" style="fill:var(--surface)"/>
  <rect x="45" y="49" width="126" height="66" rx="15" style="fill:none;stroke:var(--rule-strong);stroke-width:2;stroke-dasharray:6 6"/>
  <rect x="177" y="48" width="128" height="68" rx="16" style="fill:var(--ink)"/>
  <g text-anchor="middle" style="font:600 20px var(--font-sans)">
    <text x="108" y="89" style="fill:var(--ink)">30 g</text>
    <text x="241" y="89" style="fill:var(--page)">50 g</text>
    <text x="372" y="89" style="fill:var(--ink)">100 g</text>
  </g>
  <!-- The slide -->
  <rect x="86" y="138" width="176" height="28" rx="14" style="fill:var(--accent)"/>
  <path d="M104 152h136m-9-8 9 8-9 8" style="fill:none;stroke:var(--on-accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- Underneath: three real radios, the middle one checked -->
  <path d="M108 178v12M241 178v12M372 178v12" style="stroke:var(--hairline);stroke-width:2;stroke-linecap:round"/>
  <rect x="36" y="198" width="408" height="44" rx="14" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <circle cx="108" cy="220" r="10" style="fill:none;stroke:var(--control-off);stroke-width:2"/>
  <circle cx="241" cy="220" r="8" style="fill:var(--raised);stroke:var(--ink);stroke-width:6"/>
  <circle cx="372" cy="220" r="10" style="fill:none;stroke:var(--control-off);stroke-width:2"/>
</svg>
