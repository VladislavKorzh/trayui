<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The setting, on, and the parts that move without a keyframe animation, each standing still at its end:
       a button, the pill of a segmented control, a chevron turned open, a bar filled. -->
  <rect x="32.75" y="36.75" width="202.5" height="58.5" rx="15.25" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="50" y="71" style="fill:var(--ink);font:600 16px var(--font-sans)">Reduce motion</text>
  <rect x="176" y="52" width="46" height="28" rx="14" style="fill:var(--ink)"/>
  <circle cx="208" cy="66" r="10" style="fill:var(--page)"/>

  <rect x="32" y="114" width="168" height="52" rx="18" style="fill:var(--accent)"/>
  <text x="116" y="145.5" text-anchor="middle" style="fill:var(--on-accent);font:600 17px var(--font-sans)">Order a jar</text>

  <rect x="32" y="186" width="204" height="48" rx="15" style="fill:var(--surface)"/>
  <rect x="102" y="192" width="64" height="36" rx="11" style="fill:var(--ink)"/>
  <g text-anchor="middle" style="font:600 15px var(--font-sans)">
    <text x="67" y="215" style="fill:var(--ink)">30 g</text>
    <text x="134" y="215" style="fill:var(--page)">50 g</text>
    <text x="201" y="215" style="fill:var(--ink)">100 g</text>
  </g>

  <rect x="260.75" y="36.75" width="186.5" height="196.5" rx="19.25" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="280" y="72" style="fill:var(--ink);font:600 16px var(--font-sans)">Shop</text>
  <path transform="translate(408 54)" d="m6 9 6 6 6-6" style="fill:none;stroke:var(--ink);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="292" y="102" style="fill:var(--ink-soft);font:500 15px var(--font-sans)">Orders</text>
  <text x="292" y="130" style="fill:var(--ink-soft);font:500 15px var(--font-sans)">Stock</text>
  <path d="M276 150h156" style="stroke:var(--hairline);stroke-width:1.5"/>
  <text x="280" y="180" style="fill:var(--ink);font:500 15px var(--font-sans)">Upload</text>
  <text x="428" y="180" text-anchor="end" style="fill:var(--ink-soft);font:500 15px var(--font-sans)">70%</text>
  <rect x="280" y="196" width="148" height="8" rx="4" style="fill:var(--track)"/>
  <rect x="280" y="196" width="104" height="8" rx="4" style="fill:var(--ink)"/>
</svg>
