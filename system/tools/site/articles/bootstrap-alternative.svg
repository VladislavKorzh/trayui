<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site:
       three files, linked as they are, and the page they make, with nothing built in between. -->
  <g style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5">
    <rect x="32" y="48" width="184" height="50" rx="14"/>
    <rect x="32" y="110" width="184" height="50" rx="14"/>
    <rect x="32" y="172" width="184" height="50" rx="14"/>
  </g>
  <g style="fill:none;stroke:var(--ink-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <path transform="translate(46 61)" d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4"/>
    <path transform="translate(46 123)" d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4"/>
    <path transform="translate(46 185)" d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4"/>
  </g>
  <g style="fill:var(--ink);font:500 17px var(--font-mono)">
    <text x="82" y="79">tokens.css</text>
    <text x="82" y="141">bundle.css</text>
    <text x="82" y="203">bundle.js</text>
  </g>
  <!-- Straight into the page -->
  <path transform="translate(228 123)" d="M5 12h14m-7-7 7 7-7 7" style="fill:none;stroke:var(--ink-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- The page: a tray with a heading, a field and the one yellow button -->
  <rect x="264" y="32" width="184" height="206" rx="30" style="fill:var(--surface)"/>
  <rect x="288" y="58" width="112" height="14" rx="7" style="fill:var(--ink)"/>
  <rect x="288" y="84" width="136" height="9" rx="4.5" style="fill:var(--ink-muted)"/>
  <rect x="288" y="112" width="136" height="42" rx="14" style="fill:var(--page)"/>
  <rect x="302" y="129" width="72" height="8" rx="4" style="fill:var(--ink-hint)"/>
  <rect x="288" y="172" width="136" height="44" rx="22" style="fill:var(--accent)"/>
  <text x="356" y="200" text-anchor="middle" style="fill:var(--on-accent);font:600 17px var(--font-sans)">Pack</text>
</svg>
