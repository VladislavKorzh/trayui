<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- On the left, the app on screen in a dark theme, with its sidebar, and the button that prints it. On the right, the
       sheet: always paper and ink, the sidebar left out, the card edged, the badge still filled. -->
  <rect x="32.75" y="36.75" width="178.5" height="138.5" rx="15.25" style="fill:var(--inverse);stroke:var(--hairline);stroke-width:1.5"/>
  <rect x="44" y="48" width="38" height="116" rx="9" style="fill:var(--inverse-off)"/>
  <text x="94" y="72" style="fill:var(--on-inverse);font:600 16px var(--font-sans)">Orders</text>
  <rect x="94" y="86" width="106" height="66" rx="10" style="fill:var(--inverse-off)"/>
  <rect x="106" y="100" width="64" height="8" rx="4" style="fill:var(--on-inverse)"/>
  <rect x="106" y="122" width="46" height="18" rx="6" style="fill:var(--on-inverse)"/>
  <rect x="32" y="192" width="112" height="44" rx="16" style="fill:var(--accent)"/>
  <text x="88" y="220" text-anchor="middle" style="fill:var(--on-accent);font:600 16px var(--font-sans)">Print</text>

  <path d="M222 135h22m-7-7 7 7-7 7" style="fill:none;stroke:var(--ink-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>

  <rect x="256.75" y="28.75" width="190.5" height="212.5" rx="6.25" style="fill:var(--paper);stroke:var(--rule-strong);stroke-width:1.5"/>
  <text x="276" y="64" style="fill:var(--paper-ink);font:700 18px var(--font-sans)">Orders</text>
  <rect x="276.75" y="80.75" width="150.5" height="62.5" rx="11.25" style="fill:none;stroke:var(--paper-ink);stroke-width:1.5;stroke-opacity:.45"/>
  <text x="290" y="104" style="fill:var(--paper-ink);font:600 14px var(--font-sans)">PL-20418</text>
  <rect x="290" y="114" width="60" height="20" rx="6" style="fill:var(--paper-ink)"/>
  <text x="320" y="128.5" text-anchor="middle" style="fill:var(--paper);font:600 13px var(--font-sans)">Packed</text>
  <g style="fill:var(--paper-ink);opacity:.22">
    <rect x="276" y="162" width="96" height="8" rx="4"/>
    <rect x="276" y="186" width="124" height="8" rx="4"/>
    <rect x="276" y="210" width="80" height="8" rx="4"/>
  </g>
  <g style="stroke:var(--paper-ink);stroke-width:1;stroke-opacity:.3">
    <path d="M276 178h152"/>
    <path d="M276 202h152"/>
  </g>
</svg>
