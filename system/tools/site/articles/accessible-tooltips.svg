<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The bubble: solid ink, the words in the colour of the page -->
  <rect x="48" y="50" width="232" height="60" rx="14" style="fill:var(--ink)"/>
  <text x="164" y="87" text-anchor="middle" style="fill:var(--page);font:600 20px var(--font-sans)">Copy the link</text>
  <!-- The gap the pointer crosses: it belongs to the bubble -->
  <rect x="104" y="115" width="120" height="17" rx="4" style="fill:none;stroke:var(--rule-strong);stroke-width:1.5;stroke-dasharray:5 5"/>
  <!-- The icon button it names, with focus: the 3px ink ring -->
  <rect x="128" y="146" width="72" height="72" rx="18" style="fill:var(--surface)"/>
  <rect x="121.5" y="139.5" width="85" height="85" rx="24" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <g transform="translate(146 164) scale(1.5)" style="fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">
    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
  </g>
  <!-- The pointer resting on the bubble: it stays -->
  <path transform="translate(240 78) scale(1.25)" d="M0 0v30l8-7 6 13 6-3-6-12h11z" style="fill:var(--accent);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round"/>
  <!-- The key that takes it away without moving anything -->
  <rect x="320" y="150" width="116" height="64" rx="16" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <text x="378" y="189" text-anchor="middle" style="fill:var(--ink-soft);font:500 22px var(--font-mono)">Esc</text>
</svg>
