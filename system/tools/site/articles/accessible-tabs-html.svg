<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The tray strip of tabs: the selected tab is solid ink, and it has focus, so the ring is drawn inside it -->
  <rect x="32" y="36" width="416" height="58" rx="20" style="fill:var(--surface)"/>
  <text x="88" y="71" text-anchor="middle" style="fill:var(--ink);font:500 17px var(--font-sans)">Items</text>
  <rect x="144" y="41" width="130" height="48" rx="14" style="fill:var(--ink)"/>
  <rect x="148.5" y="45.5" width="121" height="39" rx="10" style="fill:none;stroke:var(--page);stroke-width:3"/>
  <text x="209" y="71" text-anchor="middle" style="fill:var(--page);font:500 17px var(--font-sans)">Delivery</text>
  <text x="310" y="71" style="fill:var(--ink);font:500 17px var(--font-sans)">Messages</text>
  <rect x="402" y="53" width="30" height="24" rx="12" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="417" y="70" text-anchor="middle" style="fill:var(--ink);font:600 14px var(--font-sans)">3</text>
  <!-- The panel of the selected tab -->
  <g transform="translate(36 120)" style="fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9m10 0h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/>
    <circle cx="17" cy="18" r="2"/>
    <circle cx="7" cy="18" r="2"/>
  </g>
  <text x="72" y="138" style="fill:var(--ink);font:600 17px var(--font-sans)">Courier</text>
  <text x="72" y="162" style="fill:var(--ink-soft);font:500 15px var(--font-sans)">Today, 14:00–18:00</text>
  <rect x="318" y="122" width="130" height="42" rx="21" style="fill:var(--accent)"/>
  <text x="383" y="148" text-anchor="middle" style="fill:var(--on-accent);font:600 15px var(--font-sans)">Track</text>
  <!-- The keys that move between the tabs -->
  <rect x="32" y="200" width="50" height="46" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <rect x="90" y="200" width="50" height="46" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <g style="fill:none;stroke:var(--ink);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round">
    <path transform="translate(45 211)" d="M19 12H5m7 7-7-7 7-7"/>
    <path transform="translate(103 211)" d="M5 12h14m-7-7 7 7-7 7"/>
  </g>
  <rect x="148" y="200" width="76" height="46" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <text x="186" y="229" text-anchor="middle" style="fill:var(--ink-soft);font:500 15px var(--font-mono)">Home</text>
  <rect x="232" y="200" width="64" height="46" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <text x="264" y="229" text-anchor="middle" style="fill:var(--ink-soft);font:500 15px var(--font-mono)">End</text>
</svg>
