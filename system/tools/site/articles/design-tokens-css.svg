<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The tokens file: a raised panel of names, each beside what it holds -->
  <rect x="32" y="34" width="204" height="202" rx="20" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <circle cx="62" cy="72" r="12" style="fill:var(--accent);stroke:var(--rule-strong);stroke-width:1.5"/>
  <circle cx="62" cy="116" r="12" style="fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.5"/>
  <g style="fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round">
    <path d="M52 170v-8a10 10 0 0 1 10-10h10"/>
    <path d="M51 194v18M73 194v18M57 203h10"/>
  </g>
  <g style="fill:var(--ink);font:500 15px var(--font-mono)">
    <text x="86" y="77">--accent</text>
    <text x="86" y="121">--surface</text>
    <text x="86" y="165">--radius-card</text>
    <text x="86" y="208">--space-4</text>
  </g>
  <!-- var(): the names flow into a component -->
  <path d="M250 135h22m-7-7 7 7-7 7" style="fill:none;stroke:var(--ink-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- The component: a card that reads them -->
  <rect x="286" y="52" width="162" height="166" rx="26" style="fill:var(--surface);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="308" y="92" style="fill:var(--ink);font:600 17px var(--font-sans)">Autumn batch</text>
  <text x="308" y="118" style="fill:var(--ink-soft);font:500 15px var(--font-sans)">Two jars, 50 g</text>
  <rect x="308" y="146" width="118" height="46" rx="16" style="fill:var(--accent)"/>
  <text x="367" y="175" text-anchor="middle" style="fill:var(--on-accent);font:600 16px var(--font-sans)">Order a jar</text>
</svg>
