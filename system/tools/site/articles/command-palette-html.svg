<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The shortcut that opens it -->
  <rect x="40" y="30" width="76" height="44" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <text x="78" y="58" text-anchor="middle" style="fill:var(--ink-soft);font:500 17px var(--font-mono)">Ctrl</text>
  <rect x="126" y="30" width="48" height="44" rx="12" style="fill:var(--accent)"/>
  <text x="150" y="58" text-anchor="middle" style="fill:var(--on-accent);font:600 17px var(--font-mono)">K</text>
  <!-- The palette: a raised panel, the field with focus on top, the list under it -->
  <rect x="40" y="88" width="400" height="152" rx="22" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <path d="M41.5 137V109.5a20.5 20.5 0 0 1 20.5-20.5h356a20.5 20.5 0 0 1 20.5 20.5V137z" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <g transform="translate(60 101)" style="fill:none;stroke:var(--ink-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.3-4.3"/>
  </g>
  <text x="96" y="120" style="fill:var(--ink);font:500 18px var(--font-sans)">ord</text>
  <path d="M129 102v24" style="stroke:var(--ink);stroke-width:2"/>
  <!-- The first match is highlighted: a fill, since focus stays in the field -->
  <rect x="50" y="148" width="380" height="40" rx="10" style="fill:var(--surface)"/>
  <text x="68" y="174" style="fill:var(--ink);font:600 17px var(--font-sans)">Orders</text>
  <text x="68" y="222" style="fill:var(--ink);font:500 17px var(--font-sans)">Export orders</text>
</svg>
