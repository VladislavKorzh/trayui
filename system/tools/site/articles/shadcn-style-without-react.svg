<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site:
       the markup you copy on the left, the dialog it makes on the right, with no framework between them. -->
  <rect x="32" y="40" width="196" height="190" rx="18" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <g style="font:500 17px var(--font-mono)">
    <text x="52" y="76" style="fill:var(--ink)">&lt;dialog</text>
    <text x="68" y="104" style="fill:var(--ink-soft)">data-tray</text>
    <text x="68" y="131" style="fill:var(--ink-soft)">="dialog"&gt;</text>
    <text x="52" y="206" style="fill:var(--ink)">&lt;/dialog&gt;</text>
  </g>
  <g style="fill:var(--track)">
    <rect x="68" y="150" width="112" height="9" rx="4.5"/>
    <rect x="68" y="170" width="80" height="9" rx="4.5"/>
  </g>
  <path transform="translate(234 123)" d="M5 12h14m-7-7 7 7-7 7" style="fill:none;stroke:var(--ink-muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- The page, and the dialog raised over it -->
  <rect x="268" y="32" width="180" height="206" rx="28" style="fill:var(--surface)"/>
  <rect x="280" y="62" width="156" height="148" rx="22" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <rect x="298" y="84" width="84" height="12" rx="6" style="fill:var(--ink)"/>
  <path transform="translate(400 78) scale(.8333)" d="M18 6 6 18M6 6l12 12" style="fill:none;stroke:var(--ink-soft);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/>
  <rect x="298" y="112" width="120" height="34" rx="12" style="fill:var(--surface)"/>
  <rect x="298" y="160" width="120" height="34" rx="17" style="fill:var(--accent)"/>
  <text x="358" y="183" text-anchor="middle" style="fill:var(--on-accent);font:600 16px var(--font-sans)">Save</text>
</svg>
