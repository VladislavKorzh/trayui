<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The password field, shown, and its eye button with focus -->
  <rect x="32" y="34" width="416" height="60" rx="16" style="fill:var(--surface)"/>
  <text x="56" y="70" style="fill:var(--ink);font:500 18px var(--font-mono)">spring-lamb-42</text>
  <rect x="388" y="40" width="48" height="48" rx="13" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <g transform="translate(400 52)" style="fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
    <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
    <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
    <path d="m2 2 20 20"/>
  </g>
  <!-- The two names it may have: a constant name and a state, or a name that changes -->
  <rect x="32" y="118" width="200" height="118" rx="18" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="52" y="156" style="fill:var(--ink);font:600 17px var(--font-sans)">Show password</text>
  <rect x="52" y="178" width="96" height="36" rx="18" style="fill:var(--accent)"/>
  <text x="100" y="202" text-anchor="middle" style="fill:var(--on-accent);font:600 15px var(--font-sans)">pressed</text>
  <rect x="248" y="118" width="200" height="118" rx="18" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="268" y="156" style="fill:var(--ink-muted);font:500 16px var(--font-sans)">Show password</text>
  <path d="M279 167v18m-6-6 6 6 6-6" style="fill:none;stroke:var(--ink-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="268" y="210" style="fill:var(--ink);font:600 17px var(--font-sans)">Hide password</text>
</svg>
