<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The label, and the value with its unit beside it -->
  <text x="40" y="62" style="fill:var(--ink);font:600 17px var(--font-sans)">Delivery radius</text>
  <text x="440" y="62" text-anchor="end" style="fill:var(--ink);font:600 17px var(--font-sans)">30 km</text>
  <!-- The track, filled up to the knob; the knob has focus, so it wears the ink ring -->
  <rect x="40" y="99" width="400" height="10" rx="5" style="fill:var(--track)"/>
  <rect x="40" y="99" width="240" height="10" rx="5" style="fill:var(--ink)"/>
  <circle cx="280" cy="104" r="15" style="fill:var(--ink)"/>
  <circle cx="280" cy="104" r="22.5" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <!-- The two ends of the scale -->
  <text x="40" y="150" style="fill:var(--ink-muted);font:500 15px var(--font-sans)">0</text>
  <text x="440" y="150" text-anchor="end" style="fill:var(--ink-muted);font:500 15px var(--font-sans)">50</text>
  <!-- What a screen reader is given: the value and its unit -->
  <circle cx="66" cy="214" r="26" style="fill:var(--accent)"/>
  <g transform="translate(52 200) scale(1.1667)" style="fill:none;stroke:var(--on-accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">
    <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
    <path d="M16 9a5 5 0 0 1 0 6"/>
    <path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>
  </g>
  <rect x="106" y="192" width="120" height="44" rx="14" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="166" y="220" text-anchor="middle" style="fill:var(--ink);font:600 17px var(--font-sans)">30 km</text>
  <!-- The arrow keys that move it a step -->
  <rect x="332" y="190" width="50" height="48" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <rect x="390" y="190" width="50" height="48" rx="12" style="fill:var(--raised);stroke:var(--rule-strong);stroke-width:2"/>
  <g style="fill:none;stroke:var(--ink);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round">
    <path transform="translate(345 202)" d="M19 12H5m7 7-7-7 7-7"/>
    <path transform="translate(403 202)" d="M5 12h14m-7-7 7 7-7 7"/>
  </g>
</svg>
