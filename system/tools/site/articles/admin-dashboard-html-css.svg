<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The sidebar on its tray: the current page in solid ink, a usage meter at its foot -->
  <rect x="28" y="28" width="126" height="214" rx="20" style="fill:var(--surface)"/>
  <rect x="38" y="40" width="106" height="34" rx="11" style="fill:var(--ink)"/>
  <g style="fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <g transform="translate(48 47) scale(.84)" style="stroke:var(--page)">
      <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
      <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </g>
    <g style="stroke:var(--ink)">
      <g transform="translate(48 89) scale(.84)">
        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
      </g>
      <g transform="translate(48 129) scale(.84)">
        <path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>
      </g>
      <g transform="translate(48 169) scale(.84)">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </g>
    </g>
  </g>
  <text x="76" y="62" style="fill:var(--page);font:600 15px var(--font-sans)">Home</text>
  <g style="fill:var(--ink);font:500 15px var(--font-sans)">
    <text x="76" y="104">Orders</text>
    <text x="76" y="144">Reports</text>
    <text x="76" y="184">Team</text>
  </g>
  <rect x="40" y="218" width="102" height="7" rx="3.5" style="fill:var(--track)"/>
  <rect x="40" y="218" width="84" height="7" rx="3.5" style="fill:var(--ink)"/>
  <!-- Two stat cards: one yellow, one on the tray -->
  <rect x="168" y="28" width="136" height="80" rx="18" style="fill:var(--accent)"/>
  <text x="186" y="54" style="fill:var(--on-accent);font:500 14px var(--font-sans)">Orders</text>
  <text x="186" y="90" style="fill:var(--on-accent);font:700 27px var(--font-sans)">243</text>
  <rect x="316" y="28" width="136" height="80" rx="18" style="fill:var(--surface)"/>
  <text x="334" y="54" style="fill:var(--ink-muted);font:500 14px var(--font-sans)">Revenue</text>
  <text x="334" y="90" style="fill:var(--ink);font:700 27px var(--font-sans)">$23,513</text>
  <!-- The chart: one series of bars in ink on a strong baseline -->
  <rect x="168" y="120" width="284" height="122" rx="20" style="fill:var(--surface)"/>
  <text x="186" y="146" style="fill:var(--ink);font:600 15px var(--font-sans)">Orders per day</text>
  <g style="fill:var(--ink)">
    <rect x="190" y="180" width="14" height="44" rx="3"/>
    <rect x="216" y="189" width="14" height="35" rx="3"/>
    <rect x="242" y="195" width="14" height="29" rx="3"/>
    <rect x="268" y="183" width="14" height="41" rx="3"/>
    <rect x="294" y="174" width="14" height="50" rx="3"/>
    <rect x="320" y="180" width="14" height="44" rx="3"/>
    <rect x="346" y="177" width="14" height="47" rx="3"/>
    <rect x="372" y="160" width="14" height="64" rx="3"/>
    <rect x="398" y="176" width="14" height="48" rx="3"/>
  </g>
  <path d="M184 225h250" style="stroke:var(--rule-strong);stroke-width:2"/>
</svg>
