<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The filter that hides every row stays in view as a chip, beside the count of what matches -->
  <rect x="36" y="26" width="146" height="38" rx="19" style="fill:var(--surface);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="55" y="51" style="fill:var(--ink);font:500 16px var(--font-sans)">City: Lviv</text>
  <path transform="translate(149 36) scale(.75)" d="M18 6 6 18m0-12 12 12" style="fill:none;stroke:var(--ink-soft);stroke-width:2.6;stroke-linecap:round"/>
  <text x="444" y="51" text-anchor="end" style="fill:var(--ink-muted);font:500 16px var(--font-sans)">0 of 312 match</text>
  <!-- The table keeps its column heads -->
  <g style="fill:var(--ink-muted);font:500 15px var(--font-sans)">
    <text x="36" y="96">Customer</text>
    <text x="266" y="96">Orders</text>
    <text x="444" y="96" text-anchor="end">Spent</text>
  </g>
  <path d="M36 108h408" style="stroke:var(--hairline);stroke-width:1.5"/>
  <!-- One row says why it is empty and offers one way out -->
  <rect x="217" y="118" width="46" height="46" rx="12" style="fill:var(--surface);stroke:var(--hairline);stroke-width:1.5"/>
  <g transform="translate(228 129)" style="fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.3-4.3"/>
  </g>
  <text x="240" y="192" text-anchor="middle" style="fill:var(--ink);font:600 20px var(--font-sans)">No customer matches</text>
  <rect x="150" y="202" width="180" height="42" rx="21" style="fill:var(--accent)"/>
  <text x="240" y="229" text-anchor="middle" style="fill:var(--on-accent);font:600 17px var(--font-sans)">Clear the filters</text>
</svg>
