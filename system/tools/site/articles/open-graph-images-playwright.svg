<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- A link as a chat shows it: a raised panel, the page's picture on top, its address and title under it -->
  <rect x="32" y="30" width="292" height="210" rx="20" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <!-- The picture, 1.91 to 1 like the 1200 by 630 card: the mark and the name on the tray, the live preview on the page -->
  <rect x="44" y="42" width="268" height="140" rx="12" style="fill:var(--surface);stroke:var(--hairline);stroke-width:1.5"/>
  <rect x="58" y="56" width="20" height="20" rx="6" style="fill:var(--accent)"/>
  <rect x="63" y="65" width="10" height="6.5" rx="2.5" style="fill:var(--on-accent)"/>
  <text x="58" y="138" style="fill:var(--ink-muted);font:500 13px var(--font-sans)">Component</text>
  <text x="58" y="164" style="fill:var(--ink);font:700 24px var(--font-sans)">Button</text>
  <rect x="166" y="54" width="134" height="116" rx="12" style="fill:var(--page);stroke:var(--hairline);stroke-width:1.5"/>
  <rect x="179" y="94" width="108" height="36" rx="11" style="fill:var(--accent)"/>
  <text x="233" y="117" text-anchor="middle" style="fill:var(--on-accent);font:600 14px var(--font-sans)">Order a jar</text>
  <!-- Under the picture: the site and the page -->
  <text x="48" y="206" style="fill:var(--ink-muted);font:500 13px var(--font-sans)">trayui.com</text>
  <text x="48" y="228" style="fill:var(--ink);font:600 16px var(--font-sans)">Button</text>
  <!-- What the build writes for it -->
  <g style="fill:none;stroke:var(--rule-strong);stroke-width:1.5">
    <rect x="344" y="62" width="104" height="38" rx="19"/>
    <rect x="344" y="116" width="104" height="38" rx="19"/>
    <rect x="344" y="170" width="104" height="38" rx="19"/>
  </g>
  <g text-anchor="middle" style="fill:var(--ink-soft);font:500 15px var(--font-mono)">
    <text x="396" y="86">og:image</text>
    <text x="396" y="140">1200×630</text>
    <text x="396" y="194">.jpg</text>
  </g>
</svg>
