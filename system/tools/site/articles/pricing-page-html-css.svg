<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The billing period: two segments, Yearly chosen -->
  <rect x="146" y="22" width="188" height="44" rx="22" style="fill:var(--surface)"/>
  <rect x="242" y="27" width="87" height="34" rx="17" style="fill:var(--ink)"/>
  <g text-anchor="middle" style="font:600 15px var(--font-sans)">
    <text x="195" y="49" style="fill:var(--ink)">Monthly</text>
    <text x="285.5" y="49" style="fill:var(--page)">Yearly</text>
  </g>
  <!-- Three plans, the recommended one yellow -->
  <rect x="28" y="80" width="134" height="166" rx="22" style="fill:var(--surface)"/>
  <rect x="173" y="80" width="134" height="166" rx="22" style="fill:var(--accent)"/>
  <rect x="318" y="80" width="134" height="166" rx="22" style="fill:var(--surface)"/>
  <g style="font:700 16px var(--font-sans)">
    <text x="46" y="110" style="fill:var(--ink)">Stall</text>
    <text x="191" y="110" style="fill:var(--on-accent)">Shop</text>
    <text x="336" y="110" style="fill:var(--ink)">Market</text>
  </g>
  <g style="font:700 34px var(--font-sans)">
    <text x="45" y="154" style="fill:var(--ink)">$0</text>
    <text x="190" y="154" style="fill:var(--on-accent)">$24</text>
    <text x="335" y="154" style="fill:var(--ink)">$66</text>
  </g>
  <g style="font:500 14px var(--font-sans)">
    <text x="46" y="177" style="fill:var(--ink-soft)">for good</text>
    <text x="191" y="177" style="fill:var(--on-accent)">a month</text>
    <text x="336" y="177" style="fill:var(--ink-soft)">a month</text>
  </g>
  <!-- What each plan includes: a check per line -->
  <g style="fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round">
    <g style="stroke:var(--ink)">
      <path transform="translate(44 192) scale(.67)" d="M20 6 9 17l-5-5"/>
      <path transform="translate(334 192) scale(.67)" d="M20 6 9 17l-5-5"/>
      <path transform="translate(334 214) scale(.67)" d="M20 6 9 17l-5-5"/>
    </g>
    <path transform="translate(44 214) scale(.67)" d="M5 12h14" style="stroke:var(--ink-hint)"/>
    <g style="stroke:var(--on-accent)">
      <path transform="translate(189 192) scale(.67)" d="M20 6 9 17l-5-5"/>
      <path transform="translate(189 214) scale(.67)" d="M20 6 9 17l-5-5"/>
    </g>
  </g>
  <g style="fill:var(--track)">
    <rect x="68" y="196" width="72" height="8" rx="4"/>
    <rect x="68" y="218" width="56" height="8" rx="4"/>
    <rect x="358" y="196" width="76" height="8" rx="4"/>
    <rect x="358" y="218" width="64" height="8" rx="4"/>
  </g>
  <g style="fill:var(--on-accent);opacity:.3">
    <rect x="213" y="196" width="76" height="8" rx="4"/>
    <rect x="213" y="218" width="60" height="8" rx="4"/>
  </g>
</svg>
