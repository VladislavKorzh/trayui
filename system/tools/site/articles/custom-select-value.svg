<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- The picture of the article in the Articles list. Every colour is a token, so it wears the theme of the site. -->
  <!-- The field: its label, and the trigger that shows the value -->
  <text x="40" y="44" style="fill:var(--ink-soft);font:600 15px var(--font-sans)">Jar size</text>
  <rect x="40" y="56" width="196" height="48" rx="14" style="fill:var(--surface)"/>
  <text x="58" y="86" style="fill:var(--ink);font:600 17px var(--font-sans)">50 g</text>
  <path transform="translate(202 68)" d="m7 15 5 5 5-5M7 9l5-5 5 5" style="fill:none;stroke:var(--ink-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
  <!-- The list under it: the chosen option filled, ticked and ringed -->
  <rect x="40" y="114" width="196" height="126" rx="18" style="fill:var(--raised);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="60" y="145" style="fill:var(--ink);font:500 17px var(--font-sans)">30 g</text>
  <rect x="48" y="158" width="180" height="38" rx="10" style="fill:var(--surface)"/>
  <rect x="49.5" y="159.5" width="177" height="35" rx="9" style="fill:none;stroke:var(--ink);stroke-width:3"/>
  <text x="60" y="183" style="fill:var(--ink);font:600 17px var(--font-sans)">50 g</text>
  <path transform="translate(196 165)" d="M20 6 9 17l-5-5" style="fill:none;stroke:var(--ink);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="60" y="224" style="fill:var(--ink);font:500 17px var(--font-sans)">100 g</text>
  <!-- What each is named: the trigger by its label and its value, the list by its label -->
  <g style="fill:none;stroke:var(--ink-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
    <path d="M248 80h26m-7-7 7 7-7 7"/>
    <path d="M248 177h26m-7-7 7 7-7 7"/>
  </g>
  <rect x="284" y="56" width="160" height="48" rx="24" style="fill:var(--accent)"/>
  <text x="364" y="86" text-anchor="middle" style="fill:var(--on-accent);font:600 17px var(--font-sans)">Jar size 50 g</text>
  <rect x="284" y="153" width="160" height="48" rx="24" style="fill:var(--inverse);stroke:var(--hairline);stroke-width:1.5"/>
  <text x="364" y="183" text-anchor="middle" style="fill:var(--on-inverse);font:600 17px var(--font-sans)">Jar size</text>
</svg>
