# Builds the system and the site and runs every check (system/tools/check.py), then makes sure the built files kept in
# the repository (system/dist, the generated guides and React sources) were rebuilt with the change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: system/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            system/react/package-lock.json
            system/tests/package-lock.json

      - name: Install the Python tools and Google Chrome
        run: |
          python -m pip install -r system/requirements.txt
          python -m playwright install --with-deps chrome

      - name: Install the React package
        working-directory: system/react
        run: npm ci

      - name: Build and check
        working-directory: system
        run: python tools/check.py

      - name: The built files in the repository are up to date
        run: |
          if ! git diff --exit-code --stat -- system; then
            echo "::error::Run python3 system/tools/build.py and python3 system/tools/site.py, and commit what they changed."
            exit 1
          fi
